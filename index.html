<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>StudyLink — Peer Tutoring</title>
<style>
  :root{
    --bg:#eef2fb; --card:#ffffff; --ink:#2f3350; --muted:#8b8fa8; --line:#eceaf5;
    --blue:#7aa7f0; --blue-d:#4d7fd6; --pink:#f28fb4; --pink-d:#e0679a;
    --purple:#a78be6; --green:#63c39a; --orange:#f0a868; --star:#f5b942;
    --good:#3fae7a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--ink); min-height:100vh;
  }
  /* App shell — a sidebar like ETS, content on the right */
  .app{min-height:100vh}
  .side{
    position:fixed; top:0; left:0; bottom:0; width:256px; z-index:40;
    background:rgba(255,255,255,.94); backdrop-filter:blur(8px);
    box-shadow:0 0 24px rgba(60,50,110,.10); display:flex; flex-direction:column;
    transform:translateX(-100%); transition:transform .25s ease;
  }
  .app.open .side{transform:none}
  .scrim{position:fixed; inset:0; background:rgba(0,0,0,.3); z-index:30; display:none}
  .app.open .scrim{display:block}
  .side .shead{display:flex; align-items:center; gap:9px; padding:16px; border-bottom:1px solid var(--line)}
  .side .shead .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--blue),var(--purple));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:16px}
  .side .shead b{font-size:17px; font-weight:800}
  .side .shead{position:relative}
  .side .shead .dots{margin-left:auto; border:none; background:none; font-size:20px; font-weight:900; color:var(--muted); cursor:pointer; width:32px; height:32px; border-radius:8px}
  .side .shead .dots:hover{background:#eef0f6}
  .menuscrim{position:fixed; inset:0; z-index:44}
  .menu-pop{position:absolute; top:52px; right:10px; z-index:45; width:190px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:6px; box-shadow:0 12px 32px rgba(60,50,110,.18)}
  .menu-pop hr{margin:4px}
  .side .shead .x{ border:none; background:none; font-size:20px; color:var(--muted); cursor:pointer; padding:2px 6px; border-radius:6px}
  .modes{display:flex; gap:4px; margin:10px 10px 2px; background:#eef0f6; padding:4px; border-radius:11px}
  .modes button{flex:1; border:0; background:transparent; padding:8px 0; border-radius:8px; font:inherit; font-size:13.5px; font-weight:700; color:#6b7088; cursor:pointer}
  .modes button.on{background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(20,25,40,.14)}
  .side nav{flex:1; overflow-y:auto; padding:8px}
  .nitem{display:flex; align-items:center; gap:10px; width:100%; border:none; background:none; cursor:pointer;
    padding:9px 12px; border-radius:10px; font:inherit; font-size:14.5px; font-weight:600; color:#5b6077; text-align:left}
  .nitem:hover{background:#e3ecfd}
  .nitem.on{background:#fcdbe8; color:var(--ink)}
  .nitem .ic{width:20px; text-align:center; font-size:16px}
  .nitem .chev{margin-left:auto; color:var(--muted); font-size:12px; transition:transform .2s}
  .nitem .chev.down{transform:rotate(90deg)}
  .nitem .count{margin-left:auto; background:var(--pink-d); color:#fff; font-size:10.5px; font-weight:800; border-radius:9px; padding:1px 7px}
  .sub{padding:2px 0 4px 18px}
  .sub .nitem{font-size:13.5px; padding:7px 10px}
  .sub .dot{width:9px; height:9px; border-radius:50%; flex:0 0 auto}
  .sub .add{color:var(--blue-d)}
  .side hr{border:none; border-top:1px solid var(--line); margin:8px 4px}
  .side .sfoot{border-top:1px solid var(--line); padding:12px}
  .side .who{display:flex; align-items:center; gap:10px; margin-bottom:2px}
  .side .who .avatar{width:34px;height:34px;font-size:13px}

  .main{min-height:100vh; display:flex; flex-direction:column}
  .head{
    position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:10px;
    padding:12px 18px; background:rgba(238,242,251,.9); backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
  }
  .head .menu{border:none; background:#fff; border-radius:10px; width:38px; height:38px; font-size:18px; cursor:pointer; box-shadow:0 2px 8px rgba(60,50,110,.12)}
  .head h1{font-size:17px; margin:0; font-weight:800}
  .head .right{margin-left:auto; font-size:12px; color:var(--muted); font-weight:700; text-align:right}
  .scroll{flex:1; width:100%; max-width:980px; margin:0 auto; padding:18px 18px 60px}

  @media (min-width:900px){
    .side{transform:none}
    .side .shead .x, .head .menu, .scrim{display:none !important}
    .main{margin-left:256px}
  }

  /* Grids */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px}
  .grid .card + .card{margin-top:0}
  .classcard{cursor:pointer; position:relative; border-top:5px solid var(--c)}
  .classcard .rm{position:absolute; top:8px; right:8px; border:none; background:#f3f1f9; color:var(--muted); width:26px; height:26px; border-radius:50%; cursor:pointer; font-size:14px}
  .addcard{display:flex; align-items:center; justify-content:center; gap:8px; min-height:96px; cursor:pointer; border:2px dashed #d6dcf0; background:transparent; box-shadow:none; color:var(--blue-d); font-weight:800}
  .cols{display:grid; grid-template-columns:1fr; gap:16px}
  @media (min-width:760px){ .cols{grid-template-columns:3fr 2fr} .cols.even{grid-template-columns:1fr 1fr} }

  /* Calendar */
  .calhead{display:flex; align-items:center; gap:8px; margin-bottom:10px}
  .calhead h3{margin:0; font-size:18px; font-weight:800; flex:1}
  .calhead button{border:1px solid var(--line); background:#fff; border-radius:10px; padding:7px 12px; font-weight:800; cursor:pointer; color:var(--ink)}
  .cal{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
  .cal .dow{font-size:11px; font-weight:800; color:var(--muted); text-align:center; padding:4px 0; text-transform:uppercase}
  .cal .day{background:#fff; border:1px solid var(--line); border-radius:10px; min-height:84px; padding:5px; cursor:pointer; overflow:hidden; text-align:left; font:inherit; color:var(--ink); display:flex; flex-direction:column; justify-content:flex-start; min-width:0}
  .cal .day.out{opacity:.4}
  .cal .day.today .n{background:var(--blue-d); color:#fff}
  .cal .day.sel{border-color:var(--purple); box-shadow:0 0 0 2px #e4dcfa}
  .cal .day .n{align-self:flex-start; display:inline-flex; width:24px; height:24px; align-items:center; justify-content:center; border-radius:50%; font-size:12.5px; font-weight:800}
  .cal .ev{font-size:10.5px; font-weight:700; padding:2px 5px; border-radius:6px; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; background:#f2f0fb; border-left:3px solid var(--c)}
  .cal .more{font-size:10px; color:var(--muted); font-weight:700; margin-top:2px}
  @media (max-width:600px){
    .cal .day{min-height:52px}
    .cal .ev{font-size:0; padding:0; height:6px; border-left:none; background:var(--c)}
    .cal .more{display:none}
  }
  .evrow{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line)}
  .evrow:last-child{border-bottom:none}
  .evrow .bar{width:4px; align-self:stretch; border-radius:3px; background:var(--c)}
  .evrow .del{margin-left:auto; border:none; background:none; color:var(--muted); cursor:pointer; font-size:16px}

  /* Sign-in: a centred card, no sidebar or header behind it */
  .app.auth .side,.app.auth .scrim,.app.auth .head{display:none !important}
  .app.auth .main{margin-left:0}
  .app.auth .scroll{max-width:none; padding:0}
  .auth-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:28px 16px;
    background:radial-gradient(900px 520px at 15% -10%, #dde8fd 0%, transparent 60%), radial-gradient(800px 520px at 100% 110%, #fbe3ee 0%, transparent 60%), var(--bg)}
  .auth-card{width:100%; max-width:400px; background:#fff; border:1px solid var(--line); border-radius:22px; padding:28px 24px 22px; box-shadow:0 22px 60px rgba(60,50,110,.14)}
  .auth-logo{width:58px; height:58px; border-radius:17px; background:linear-gradient(135deg,var(--blue),var(--purple)); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:900; font-size:28px; margin:0 auto 12px; box-shadow:0 10px 22px rgba(120,100,220,.28)}
  .auth-card h2{margin:0; text-align:center; font-size:24px; font-weight:800; letter-spacing:.2px}
  .auth-card .lead{text-align:center; margin:4px 0 18px}
  .auth-card .field:last-child{margin-bottom:0}
  .pw{position:relative}
  .pw input{padding-right:58px}
  .pw .eye{position:absolute; right:6px; top:50%; transform:translateY(-50%); border:none; background:none; cursor:pointer; color:var(--blue-d); font:inherit; font-size:12px; font-weight:800; padding:6px 8px; border-radius:8px}
  .pw .eye:hover{background:#eef2fb}
  .auth-msg{margin-top:12px; border-radius:11px; padding:10px 12px; font-size:13px; font-weight:700; line-height:1.35}
  .auth-msg.err{background:#fdecef; color:#c23b5e}
  .auth-msg.ok{background:#e6f6ee; color:#2f8a5e}
  .auth-card .btn{margin-top:16px}
  .auth-links{display:flex; justify-content:space-between; gap:10px; margin-top:14px}
  .auth-links button{border:none; background:none; cursor:pointer; font:inherit; font-size:13px; font-weight:800; color:var(--blue-d); padding:4px 0}
  .auth-links button:hover{text-decoration:underline}
  .auth-links.center{justify-content:center}
  .auth-alias{margin:14px 0 4px; text-align:center; background:linear-gradient(135deg,#eaf0fe,#f6edf8); border-radius:16px; padding:20px 14px}
  .auth-alias .big{font-size:32px; font-weight:800; margin:6px 0 4px; color:var(--ink)}
  .auth-foot{text-align:center; margin-top:18px; font-size:11.5px; color:var(--muted); font-weight:600}

  /* Roles */
  .rolebadge{display:inline-block; font-size:10.5px; font-weight:800; letter-spacing:.4px; text-transform:uppercase; padding:2px 8px; border-radius:8px; vertical-align:middle}
  .rolebadge.admin{background:#e6eefb; color:#4d7fd6}
  .rolebadge.board{background:#f1e9fd; color:#7c5fd0}
  .verified{display:inline-block; font-size:11px; font-weight:800; color:#2e9b6a; background:#e4f6ec; border-radius:8px; padding:2px 7px; margin-left:6px}
  .unverified{display:inline-block; font-size:11px; font-weight:700; color:#c98b34; background:#fbf1e2; border-radius:8px; padding:2px 7px; margin-left:6px}
  .side .section{font-size:10.5px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); padding:6px 12px 2px}

  .mrow{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
  .mrow .ctl{margin-left:auto; display:flex; align-items:center; gap:6px; flex-wrap:wrap}
  .mrow select.lvl{padding:7px 10px; border:1.5px solid #e5e2f0; border-radius:10px; font:inherit; font-size:12.5px; font-weight:700; color:var(--ink); background:#fff}
  .mrow select.lvl:disabled{opacity:.6}
  .mrow .mini{border:1px solid #dbe3f7; background:#fff; color:var(--blue-d); border-radius:10px; padding:7px 10px; font:inherit; font-size:12.5px; font-weight:800; cursor:pointer}
  .mrow .mini.danger{color:#c23b5e; border-color:#f5d3dc}
  .mrow .mini:hover{background:#eef3fe}
  .mrow .mini.danger:hover{background:#fdecef}
  .medit{display:flex; gap:8px; flex-wrap:wrap; width:100%; margin-top:8px}
  .medit input,.medit select{padding:9px 11px; border:1.5px solid #e5e2f0; border-radius:10px; font:inherit; font-size:13.5px; background:#fff}
  .mrow .info{min-width:0; flex:1 1 220px}
  @media (max-width:640px){
    .mrow .ctl{flex-basis:100%; margin-left:0; padding-left:56px}
  }

  /* Home: this week at a glance, and the two session columns */
  .week{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
  .wday{background:#fff; border:1px solid var(--line); border-radius:12px; padding:8px 6px 7px; min-height:86px; cursor:pointer; text-align:center; font:inherit; color:var(--ink); display:flex; flex-direction:column; gap:4px; min-width:0}
  .wday:hover{border-color:#cdd7f3}
  .wday .dn{font-size:10px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; color:var(--muted)}
  .wday .dd{font-size:16px; font-weight:800; width:28px; height:28px; line-height:28px; border-radius:50%; margin:0 auto}
  .wday.today .dd{background:var(--blue-d); color:#fff}
  .wday.past{opacity:.6}
  .wday .wi{font-size:10px; font-weight:700; padding:2px 5px; border-radius:6px; background:#f2f0fb; border-left:3px solid var(--c); text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .wday .wi.sess{background:#e4f6ec}
  .wday .wi.pend{background:#fbf1e2}
  .wday .more{font-size:9.5px; color:var(--muted); font-weight:700}
  .sessrow{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line)}
  .sessrow:last-child{border-bottom:none}
  .sessrow .when{font-size:11px; font-weight:800; color:var(--blue-d); background:#eef3fe; border-radius:8px; padding:3px 7px; white-space:nowrap}
  .sessrow .who{font-weight:800; font-size:14px}
  .sessrow .meta{font-size:12px; color:var(--muted); font-weight:600}
  @media (max-width:600px){
    .wday{min-height:60px; padding:6px 3px}
    .wday .wi{font-size:0; height:6px; padding:0; border-left:none; background:var(--c)}
    .wday .more{display:none}
  }

  /* Bits */
  h2.title{font-size:22px; font-weight:800; margin:4px 2px 2px}
  .lead{color:var(--muted); font-size:13px; font-weight:600; margin:0 2px 14px}
  .sectlabel{font-size:11px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); margin:20px 2px 8px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; box-shadow:0 4px 16px rgba(90,70,150,.05)}
  .card + .card{margin-top:10px}
  .search{display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px 14px; box-shadow:0 4px 16px rgba(90,70,150,.05)}
  .search input{border:none; outline:none; font-size:15px; width:100%; font-family:inherit; color:var(--ink); background:transparent}
  .search .mag{font-size:16px}

  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{border:none; cursor:pointer; padding:8px 13px; border-radius:20px; font-weight:700; font-size:13px; background:#fff; border:1px solid var(--line); color:var(--ink)}
  .chip.dept{color:#fff}

  .btn{border:none; cursor:pointer; border-radius:12px; font-weight:800; font-size:14px; padding:12px 16px; width:100%; color:#fff; background:linear-gradient(120deg,var(--blue),var(--purple)); box-shadow:0 6px 16px rgba(120,110,220,.28)}
  .btn:active{transform:translateY(1px)}
  .btn.sm{width:auto; padding:9px 14px; font-size:13px; border-radius:10px}
  .btn.ghost{background:#fff; color:var(--blue-d); border:1.5px solid #dbe3f7; box-shadow:none}
  .btn.green{background:linear-gradient(120deg,#6bcfa2,#43ae7a); box-shadow:0 6px 16px rgba(80,190,140,.28)}
  .btn.pink{background:linear-gradient(120deg,#f6a6c2,var(--pink-d))}
  .btn.gray{background:#f0eef7; color:var(--muted); box-shadow:none}
  .btn:disabled{opacity:.5}

  .avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;flex:0 0 auto}
  .row{display:flex; align-items:center; gap:12px}
  .grade{font-weight:800; padding:2px 8px; border-radius:8px; font-size:12px}
  .g-A{background:#e4f6ec;color:#2e9b6a}.g-B{background:#e6eefb;color:#4d7fd6}.g-C{background:#fbf1e2;color:#c98b34}
  .stars{color:var(--star); font-weight:800; font-size:13px}
  .tiny{font-size:11.5px; color:var(--muted); font-weight:600}
  .pill{display:inline-block; background:#f2f0fb; color:#7a6fb0; font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; margin:2px 3px 0 0}
  .tutorcard .top{display:flex; gap:12px; align-items:flex-start}
  .tutorcard h3{margin:0; font-size:16px; font-weight:800}

  .back{display:inline-flex; align-items:center; gap:6px; background:none; border:none; color:var(--muted); font-weight:700; font-size:14px; cursor:pointer; padding:2px 0; margin-bottom:6px}

  .field{margin-bottom:12px}
  .field label{display:block; font-size:12px; font-weight:800; color:var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:.4px}
  .field input,.field select,.field textarea{width:100%; padding:11px 12px; border:1.5px solid #e5e2f0; border-radius:11px; font-size:15px; font-family:inherit; color:var(--ink); outline:none; background:#fff}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--purple)}
  .seg{display:flex; gap:6px}
  .seg button{flex:1; border:1.5px solid #e5e2f0; background:#fff; border-radius:11px; padding:10px; font-weight:700; font-size:13px; color:var(--muted); cursor:pointer}
  .seg button.on{border-color:var(--blue); background:#eef3fe; color:var(--blue-d)}

  .post{border-bottom:1px solid var(--line); padding:12px 0}
  .post:last-child{border-bottom:none}
  .post .who{font-weight:800; font-size:13px}
  .post .txt{font-size:14px; margin-top:2px; line-height:1.4}
  .reply{margin:8px 0 0 14px; padding:8px 11px; background:#f7f6fc; border-radius:11px; font-size:13px}
  .composer{display:flex; gap:8px; margin-top:12px}
  .composer input{flex:1; padding:11px 12px; border:1.5px solid #e5e2f0; border-radius:11px; font-size:14px; outline:none; font-family:inherit}

  .empty{text-align:center; color:var(--muted); padding:34px 16px; font-size:14px}
  .empty .em{font-size:38px; margin-bottom:8px}

  .toast{position:fixed; left:50%; bottom:78px; transform:translateX(-50%) translateY(20px); background:#2f3350; color:#fff; padding:11px 16px; border-radius:12px; font-size:13px; font-weight:700; opacity:0; transition:.3s; pointer-events:none; z-index:50; max-width:88%; text-align:center; box-shadow:0 8px 24px rgba(0,0,0,.2)}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  .statgrid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; text-align:center}
  .stat .n{font-size:22px; font-weight:900}
  .stat .l{font-size:11px; color:var(--muted); font-weight:700; margin-top:2px}

  .badge{position:absolute; top:-4px; right:22%; background:var(--pink-d); color:#fff; font-size:10px; font-weight:800; min-width:16px; height:16px; border-radius:9px; display:flex; align-items:center; justify-content:center; padding:0 4px}
  .navwrap{position:relative; flex:1}
  .roleswitch{display:flex;gap:6px;margin-top:10px;background:#eef0f4;padding:4px;border-radius:10px}
  .roleswitch button{flex:1;border:0;background:transparent;padding:7px 0;border-radius:7px;
    font:inherit;font-size:13px;font-weight:600;color:#5b6270;cursor:pointer;letter-spacing:.01em}
  .roleswitch button.on{background:#fff;color:#1e2330;box-shadow:0 1px 3px rgba(20,25,40,.12)}
</style>

</head>
<body>
<div class="app" id="app">
  <aside class="side" id="nav"></aside>
  <div class="scrim" onclick="toggleSide(false)"></div>
  <main class="main">
    <div class="head" id="head"></div>
    <div class="scroll" id="scroll"></div>
  </main>
  <div class="toast" id="toast"></div>
</div>

<script>
/* ============================= DATES ============================= */
// Calendar dates are kept as 'YYYY-MM-DD' in local time, so a day never
// slides across midnight the way an ISO timestamp would.
const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parseYmd = k => { const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const fmtDate = k => k ? parseYmd(k).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}) : 'TBD';
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

/* ============================= DATA ============================= */
const DEPTS = [
  { name:'Math', emoji:'📐', color:'#7aa7f0', courses:['Algebra I','Geometry','Algebra II','Precalculus','AP Precalculus','AP Calculus'] },
  { name:'Science', emoji:'🔬', color:'#63c39a', courses:['Biology','Chemistry','Honors Chemistry','Physics','AP Physics','AP Biology'] },
  { name:'Social Studies', emoji:'🌍', color:'#f0a868', courses:['AP Human Geography','World History','US History','AP US History','American Government'] },
  { name:'English', emoji:'📖', color:'#f28fb4', courses:['English 9','English 10','English 11','AP English Lang'] },
  { name:'World Languages', emoji:'🗣️', color:'#a78be6', courses:['Spanish 1','Spanish 2','Spanish 3','Spanish 4','AP Spanish','French 2'] },
  { name:'Business & Technology', emoji:'💻', color:'#5bbfd6', courses:['Computer Science Principles (CSP)','Financial Accounting'] },
];
const ALL_COURSES = DEPTS.flatMap(d => d.courses);
const courseColor = c => (DEPTS.find(d => d.courses.includes(c))?.color) || '#7aa7f0';
const courseEmoji = c => (DEPTS.find(d => d.courses.includes(c))?.emoji) || '📚';
const gradeClass = g => g?.startsWith('A') ? 'g-A' : g?.startsWith('B') ? 'g-B' : 'g-C';

// Tutors come from the sl_tutors view: alias, grade, bio and the classes they
// tutor — never a real name. Grouped per tutor after loading.
const tutorsFor = course => (S.tutors || []).filter(t => t.courses.some(c => c.course === course));
const findTutor = id => (S.tutors || []).find(t => t.id === id);
const TUTOR_COLORS = ['#f28fb4','#7aa7f0','#a78be6','#63c39a','#f0a868','#e0679a','#4d7fd6'];
const hashStr = str => Array.from(str || '').reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) >>> 0, 7);


/* ============================= STATE ============================= */
const LS='studylink-v1';
let S = {
  tab:'home', overlay:null,
  // name is filled from the signed-in profile's alias — the app never holds a
  // real name, so there is nothing to leak into a request or a post.
  me:{ name:'You', grade:11, isTutor:false, tutorCourses:[], avail:'' },
  myRequests:[],            // requests I sent to tutors (as student)
  incoming:[],              // requests sent to me (as tutor)
  hours:0, helped:0,        // service hours, from completed sessions
  posts:[],                 // every class-board post (replies have parent_id)
  tutors:[],                // everyone offering tutoring, grouped per tutor
  mode:'tutee',             // which side of the sidebar is showing: 'tutee' or 'tutor'
  myClasses:[],             // classes I'm taking (Tutee side); they fill the sidebar
  tutorClasses:[],          // classes I can tutor (Tutor side)
  events:[],                // my calendar: tests, homework, study time
  classesOpen:true,         // Classes group expanded in the sidebar
  cal:null,                 // { y, m, sel } — the month on screen
};
// Only preferences live on the device now; everything else is on the server.
const PREFS = ['mode','classesOpen'];
function load(){ try{ const s=JSON.parse(localStorage.getItem(LS)); if(s) PREFS.forEach(k=>{ if(k in s) S[k]=s[k]; }); }catch(e){} }
function save(){ const o={}; PREFS.forEach(k=>o[k]=S[k]); localStorage.setItem(LS, JSON.stringify(o)); }
const uid = () => 'x'+Math.random().toString(36).slice(2,8);

/* ============================= HELPERS ============================= */
const $ = id => document.getElementById(id);
const esc = s => (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const initials = n => (n||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }
function go(tab){ S.tab=tab; S.overlay=null; S.confirmReset=false; toggleSide(false); render(); window.scrollTo(0,0); }
function openClass(course){ S.tab='classes'; S.overlay={type:'course',course}; toggleSide(false); render(); window.scrollTo(0,0); }
// First tap opens Classes; tapping it again while there folds the list.
function navClasses(){ if(S.tab==='classes' && !S.overlay) S.classesOpen=!S.classesOpen; else S.classesOpen=true; go('classes'); }
// Tutor and Tutee share the same tabs; each keeps its own list of classes.
const classKey = () => S.mode==='tutor' ? 'tutorClasses' : 'myClasses';
// The sidebar side also picks which alias you act as: tutor posts and
// replies go out under the tutor alias, everything else under the student one.
function setMode(m){ S.mode=m; S.overlay=null; A.role = (m==='tutor' && A.profile && A.profile.tutor_alias) ? 'tutor' : 'student'; S.me.name=currentAlias(); render(); }
function toggleMenu(v){ menuOpen = v===undefined ? !menuOpen : v; renderNav(); }
function menuGo(tab){ menuOpen=false; go(tab); }
function logOut(){ menuOpen=false; signOut(); }
function toggleSide(v){ $('app').classList.toggle('open', v); }
// Not 'open' or 'close': inside an inline onclick those names resolve to
// document.open and document.close, and document.open blanks the page.
function openView(ov){ S.overlay=ov; render(); }
function closeView(){ S.overlay=null; render(); }
// Top-level posts for a class, each with its replies, oldest reply first.
function postsFor(course){
  const all = S.posts || [], me = A.user ? A.user.id : null;
  return all.filter(p => p.course===course && !p.parent_id).map(p => ({
    id:p.id, who:p.author_alias, txt:p.body, mine:p.author_id===me,
    replies: all.filter(r => r.parent_id===p.id).sort((a,b)=>a.created_at.localeCompare(b.created_at)).map(r => ({ who:r.author_alias, txt:r.body })),
  }));
}
// Accepted requests, seen from my side of them.
function sessionsList(){
  const me = A.user ? A.user.id : null;
  return [...S.myRequests, ...S.incoming].filter(r => r.status==='accepted').map(r => ({
    id:r.id, course:r.course, date:r.date, day:fmtDate(r.date), time:r.time||'TBD', format:r.format,
    with: r.tutor_id===me ? r.student_alias : r.tutor_alias, role: r.tutor_id===me ? 'tutor' : 'student', status:'upcoming',
  }));
}

/* ============================= RENDER ============================= */
function render(){
  try { renderInner(); }
  catch(e){
    // A rendering bug must never leave an empty screen.
    console.error(e);
    const c = document.getElementById('scroll');
    if(c) c.innerHTML = '<div class="card" style="margin:24px auto;max-width:520px;text-align:center"><div style="font-size:34px">😵</div><div style="font-weight:800;margin:6px 0">Something went wrong on this screen</div><div class="tiny" style="margin-bottom:12px">' + esc(String(e && e.message || e)) + '</div><div class="row" style="gap:8px;justify-content:center"><button class="btn sm gray" onclick="S.overlay=null;S.tab=\'home\';render()">Go home</button><button class="btn sm" onclick="location.reload()">Reload</button></div></div>';
  }
}
function renderInner(){
  // Nothing in the app renders until you're signed in. Names, grades and
  // requests all belong to somebody, so there's no sensible signed-out view.
  // Sign-in is parked for now (SKIP_LOGIN) — everyone lands on a demo profile.
  if(!A.profile && SKIP_LOGIN) useDemoProfile();
  document.getElementById('app').classList.toggle('auth', !A.profile);
  if(!A.profile){
    document.getElementById('head').innerHTML = '';
    document.getElementById('nav').innerHTML  = '';
    renderAuth();
    return;
  }
  if(!dataLoaded){
    if(!dataLoading && !dataError){ dataLoading = true; loadData().then(function(){ dataLoading=false; render(); }).catch(function(e){ dataLoading=false; dataError = e.message || 'Could not load your data'; render(); }); }
    document.getElementById('head').innerHTML = '';
    document.getElementById('nav').innerHTML  = '';
    document.getElementById('scroll').innerHTML = dataError
      ? '<div class="card" style="margin:60px auto;max-width:480px;text-align:center"><div style="font-size:34px">📡</div><div style="font-weight:800;margin:6px 0">Could not load your StudyLink</div><div class="tiny" style="margin-bottom:12px">' + esc(dataError) + '</div><div class="row" style="gap:8px;justify-content:center"><button class="btn sm" onclick="dataError=null;render()">Try again</button><button class="btn sm gray" onclick="logOut()">Log out</button></div></div>'
      : '<div class="empty" style="padding-top:80px"><div class="em">📚</div>Loading your StudyLink…</div>';
    return;
  }
  renderHead(); renderBody(); renderNav(); save();
}

let menuOpen = false;
const TAB_TITLES = { settings:'Settings', help:'Help', home:'Home Screen', classes:'Classes', calendar:'Calendar', tutoring:'Tutoring', community:'Community', profile:'Profile', 'admin-grades':'Grade checks', 'admin-requests':'All requests', 'admin-team':'Members' };
const isStaff = () => !!(A.profile && (A.profile.role==='admin' || A.profile.role==='board'));
const roleBadge = r => r==='admin' ? '<span class="rolebadge admin">Administrator</span>' : r==='board' ? '<span class="rolebadge board">Board</span>' : '';
function renderHead(){
  const title = S.overlay?.type==='course' ? S.overlay.course : TAB_TITLES[S.tab] || 'StudyLink';
  $('head').innerHTML = `
    <button class="menu" onclick="toggleSide(true)" aria-label="Open navigation">☰</button>
    <h1>${esc(title)}</h1>
    <div class="right">${esc(currentAlias())} ${roleBadge(A.profile.role)}<br>Grade ${S.me.grade}</div>`;
}

function incomingCount(){
  return S.incoming.filter(r=>r.status==='pending').length;
}

// The sidebar: Home Screen, your Classes (a group, like boards in ETS), Calendar.
function renderNav(){
  const ov = S.overlay;
  const item = (id, ic, label, extra='') =>
    `<button class="nitem ${S.tab===id && !ov ? 'on' : ''}" onclick="go('${id}')"><span class="ic">${ic}</span>${label}${extra}</button>`;
  const inc = incomingCount();
  $('nav').innerHTML = `
    <div class="shead">
      <div class="logo">S</div><b>StudyLink</b>
      <button class="dots" onclick="toggleMenu()" aria-label="More options">⋮</button>
      <button class="x" onclick="toggleSide(false)" aria-label="Close navigation">✕</button>
      ${menuOpen ? `<div class="menuscrim" onclick="toggleMenu(false)"></div>
      <div class="menu-pop">
        <button class="nitem" onclick="menuGo('profile')"><span class="ic">👤</span>Account</button>
        <button class="nitem" onclick="menuGo('settings')"><span class="ic">⚙️</span>Settings</button>
        <button class="nitem" onclick="menuGo('help')"><span class="ic">❓</span>Help</button>
        <hr>
        <button class="nitem" style="color:#d9534f" onclick="logOut()"><span class="ic">🚪</span>Log out</button>
      </div>` : ''}
    </div>
    <div class="modes">
      <button class="${S.mode==='tutor'?'on':''}" onclick="setMode('tutor')">🎓 Tutor</button>
      <button class="${S.mode==='tutee'?'on':''}" onclick="setMode('tutee')">📖 Tutee</button>
    </div>
    <nav>
      ${item('home','🏠','Home Screen')}
      <hr>
      <button class="nitem ${S.tab==='classes' && (!ov || ov.type==='addClasses') ? 'on' : ''}" onclick="navClasses()">
        <span class="ic">📚</span>Classes<span class="chev ${S.classesOpen?'down':''}">▶</span>
      </button>
      ${S.classesOpen ? `<div class="sub">
        ${S[classKey()].map(course=>`
          <button class="nitem ${ov?.type==='course' && ov.course===course ? 'on' : ''}" onclick="openClass('${esc(course)}')">
            <span class="dot" style="background:${courseColor(course)}"></span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(course)}</span>
          </button>`).join('')}
        <button class="nitem add" onclick="S.tab='classes'; openView({type:'addClasses'}); toggleSide(false)"><span class="ic">＋</span>Add class</button>
      </div>` : ''}
      <hr>
      ${item('calendar','📅','Calendar')}
      <hr>
      ${item('tutoring','🤝','Tutoring', inc ? `<span class="count">${inc}</span>` : '')}
      ${item('community','💬','Community')}
      ${isStaff() ? `<hr>
      <div class="section">${A.profile.role==='board' ? 'Board' : 'Administration'}</div>
      ${item('admin-grades','✅','Grade checks', S.pendingGrades ? `<span class="count">${S.pendingGrades}</span>` : '')}
      ${item('admin-requests','📋','All requests')}
      ${item('admin-team','🛡️','Members')}` : ''}
    </nav>
`;
}

function renderBody(){
  const c=$('scroll'); c.scrollTop=c.scrollTop; // keep
  if(S.overlay) return renderOverlay(c);
  if(S.tab==='home') return renderHome(c);
  if(S.tab==='classes') return renderClasses(c);
  if(S.tab==='tutoring') return renderTutoring(c);
  if(S.tab==='community') return renderCommunity(c);
  if(S.tab==='profile') return renderProfile(c);
  if(S.tab==='calendar') return renderCalendar(c);
  if(S.tab==='settings') return renderSettings(c);
  if(S.tab==='help') return renderHelp(c);
  if(S.tab==='admin-grades') return renderAdminGrades(c);
  if(S.tab==='admin-requests') return renderAdminRequests(c);
  if(S.tab==='admin-team') return renderAdminTeam(c);
  S.tab='home'; return renderHome(c);   // an unknown tab never shows an empty page
}

/* -------- SETTINGS / HELP (from the ⋮ menu) -------- */
function renderSettings(c){
  c.innerHTML = `
    <h2 class="title">Settings</h2>
    <div class="lead">Saved to your account.</div>
    <div class="card">
      <div class="field"><label>Grade</label>
        <select onchange="setGrade(+this.value)">${[9,10,11,12].map(g=>`<option ${S.me.grade===g?'selected':''}>${g}</option>`).join('')}</select></div>
      <div class="field" style="margin-bottom:0"><label>Open the sidebar on</label>
        <div class="seg">
          <button class="${S.mode==='tutor'?'on':''}" onclick="setMode('tutor')">🎓 Tutor</button>
          <button class="${S.mode==='tutee'?'on':''}" onclick="setMode('tutee')">📖 Tutee</button>
        </div></div>
    </div>
    <div class="sectlabel">Account</div>
    <div class="card">
      <div style="font-weight:800">${esc(A.profile.student_alias)}</div>
      <div class="tiny">${A.profile.tutor_alias ? 'Tutoring as ' + esc(A.profile.tutor_alias) + ' · ' : ''}Grade ${S.me.grade}</div>
      <button class="btn gray" style="margin-top:12px" onclick="logOut()">Log out</button>
    </div>`;
}
function setGrade(g){ S.me.grade=g; render(); sbFetch('/rest/v1/sl_profiles?id=eq.'+A.user.id, { method:'PATCH', headers:{ Prefer:'return=minimal' }, body:JSON.stringify({ grade_level:g }) }).catch(e=>toast(e.message)); }
function renderHelp(c){
  const q = (h, t) => `<div class="card"><div style="font-weight:800;margin-bottom:4px">${h}</div><div class="tiny" style="font-size:13px;line-height:1.5">${t}</div></div>`;
  c.innerHTML = `
    <h2 class="title">Help</h2>
    <div class="lead">How StudyLink works.</div>
    ${q('Tutor or Tutee?', 'Use the switch at the top of the sidebar. Tutee is for classes you want help in; Tutor is for classes you can teach. Each side keeps its own list of classes.')}
    ${q('Adding classes', 'Press ＋ Add class under Classes in the sidebar and tap every class that applies.')}
    ${q('Getting help', 'Open a class to see its tutors, then send a request. Once it is accepted, it shows up on your calendar.')}
    ${q('Privacy', 'Other students only see your alias. Coordination happens inside StudyLink — no phone numbers or personal emails are shared.')}
    ${q('Verified grades', 'When you become a tutor, the grades you claim go to a school administrator, who checks them against your records. Verified grades show a ✓ on your tutor card.')}
    ${q('Who runs this', 'Students use the app. Administrators verify grades and manage requests. The board maintains the app itself.')}
    ${q('Joining', 'An administrator approves you and hands you a one-time join code. Create an account with your email, that code and a password of your choosing. The code works once, so nobody else can set up your account.')}`;
}

/* -------- HOME -------- */
function renderHome(c){
  const today = ymd(new Date());
  const week = ymd(addDays(new Date(),7));
  const soon = calItems().filter(e => e.date>=today && e.date<=week).sort(byWhen).slice(0,6);
  const pending = S.myRequests.filter(r=>r.status==='pending').length;
  const inc = incomingCount();
  const hour = new Date().getHours();
  const hi = hour<12 ? 'Good morning' : hour<17 ? 'Good afternoon' : 'Good evening';
  c.innerHTML = `
    <h2 class="title">${hi}, ${esc(currentAlias())}</h2>
    <div class="lead">${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</div>

    <div class="statgrid">
      <div class="stat" style="cursor:pointer" onclick="go('classes')"><div class="n" style="color:var(--blue-d)">${S[classKey()].length}</div><div class="l">${S.mode==='tutor' ? 'classes I tutor' : 'my classes'}</div></div>
      <div class="stat" style="cursor:pointer" onclick="go('calendar')"><div class="n" style="color:var(--purple)">${soon.length}</div><div class="l">this week</div></div>
      <div class="stat" style="cursor:pointer" onclick="go('tutoring')"><div class="n" style="color:var(--pink-d)">${pending + inc}</div><div class="l">${inc ? 'requests to you' : 'pending requests'}</div></div>
    </div>

    <div class="sectlabel">This week</div>
    ${weekStrip()}

    <div class="cols even" style="margin-top:6px">
      <div>
        <div class="sectlabel">Tutoring you</div>
        <div class="card">${sessionColumn('student')}</div>
      </div>
      <div>
        <div class="sectlabel">You're tutoring</div>
        <div class="card">${sessionColumn('tutor')}</div>
      </div>
    </div>

    <div class="sectlabel">Find help</div>
    <div class="search" onclick="openView({type:'search'})" style="cursor:pointer">
      <span class="mag">🔍</span><input placeholder="Search any class…" readonly style="cursor:pointer">
    </div>

    <div class="sectlabel">${S.mode==='tutor' ? 'Classes I tutor' : 'My classes'}</div>
    ${classGrid(false)}
  `;
}

// Sunday to Saturday of the current week, with sessions, requests and events on
// each day. Tapping a day opens the calendar there.
function weekStrip(){
  const now=new Date(), today=ymd(now);
  const start=addDays(now, -now.getDay());
  const items=calItems();
  let cells='';
  for(let i=0;i<7;i++){
    const d=addDays(start,i), k=ymd(d);
    const evs=items.filter(e=>e.date===k).sort(byWhen);
    cells += `<button class="wday ${k===today?'today':''} ${k<today?'past':''}" onclick="S.cal={y:${d.getFullYear()},m:${d.getMonth()},sel:'${k}'}; go('calendar')" title="${esc(fmtDate(k))}">
      <span class="dn">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][i]}</span>
      <span class="dd">${d.getDate()}</span>
      ${evs.slice(0,3).map(e=>`<span class="wi ${e.kind==='session'?'sess':e.kind==='pending'?'pend':''}" style="--c:${courseColor(e.course)}">${esc(e.time ? e.time.replace(/:00 /,' ')+' ' : '')}${esc(e.kind==='session' ? e.title.replace(/^(Tutoring|Session with) /,'') : e.title)}</span>`).join('')}
      ${evs.length>3?`<span class="more">+${evs.length-3} more</span>`:''}
    </button>`;
  }
  return `<div class="week">${cells}</div>`;
}

// One column of the home screen: the sessions where I'm the student, or the
// ones where I'm the tutor. Upcoming first; the tutor side can mark a session
// done once its day has come.
function sessionColumn(role){
  const me=A.user ? A.user.id : null, today=ymd(new Date());
  const rows=(role==='tutor' ? S.incoming : S.myRequests)
    .filter(r=>r.status==='accepted' || (role==='student' && r.status==='pending'))
    .sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999') || (a.time||'').localeCompare(b.time||''));
  if(!rows.length){
    return role==='tutor'
      ? `<div class="tiny" style="text-align:center;padding:10px">${S.me.isTutor ? 'Nobody booked yet. Requests to you land in Tutoring.' : 'You aren\'t tutoring yet.'}</div>
         ${S.me.isTutor ? '' : `<button class="btn ghost sm" style="width:100%;margin-top:6px" onclick="openView({type:'becomeTutor'})">✋ Become a tutor</button>`}`
      : `<div class="tiny" style="text-align:center;padding:10px">No sessions booked. Open a class to find a tutor.</div>
         <button class="btn ghost sm" style="width:100%;margin-top:6px" onclick="go('classes')">Find a tutor</button>`;
  }
  const done = S.incoming.filter(r=>r.status==='done').length;
  return rows.map(r=>{
    const other = role==='tutor' ? r.student_alias : r.tutor_alias;
    const dayLabel = r.date ? (r.date===today ? 'Today' : parseYmd(r.date).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})) : 'Day TBD';
    const pending = r.status==='pending';
    return `<div class="sessrow">
      <div class="avatar" style="width:38px;height:38px;font-size:15px;background:${courseColor(r.course)}">${courseEmoji(r.course)}</div>
      <div style="min-width:0;flex:1">
        <div class="who">${esc(other)} <span class="tiny">· ${esc(r.course)}</span></div>
        <div class="meta">${esc(r.topic||'')}${r.topic?' · ':''}${esc(r.time||'Time TBD')} · ${esc(r.format)}</div>
      </div>
      ${pending ? `<span class="pill" style="background:#fbf1e2;color:#c98b34">Waiting</span>` : `<span class="when">${esc(dayLabel)}</span>`}
      ${role==='tutor' && !pending && r.date && r.date<=today ? `<button class="btn sm green" onclick="completeSession('${r.id}')">Done</button>` : ''}
    </div>`;
  }).join('') + (role==='tutor' && done ? `<div class="tiny" style="text-align:center;margin-top:8px">${done} session${done===1?'':'s'} completed · ${S.hours} service hours</div>` : '');
}

// Cards for my classes, plus one to add more. removable shows the × on each.
function classGrid(removable){
  return `<div class="grid">
    ${S[classKey()].map(course=>{
      const n=tutorsFor(course).length;
      const next=calItems().filter(e=>e.course===course && e.date>=ymd(new Date())).sort(byWhen)[0];
      return `<div class="card classcard" style="--c:${courseColor(course)}" onclick="openClass('${esc(course)}')">
        ${removable ? `<button class="rm" title="Remove class" onclick="event.stopPropagation(); removeClass('${esc(course)}')">✕</button>` : ''}
        <div style="font-size:22px">${courseEmoji(course)}</div>
        <div style="font-weight:800;margin-top:4px">${esc(course)}</div>
        <div class="tiny">${n} tutor${n===1?'':'s'} · ${postsFor(course).length} post${postsFor(course).length===1?'':'s'}</div>
        <div class="tiny" style="margin-top:6px;color:${next?'var(--ink)':'var(--muted)'}">${next ? '📅 '+esc(fmtDate(next.date))+' · '+esc(next.title) : 'Nothing scheduled'}</div>

/* -------- CALENDAR -------- */
const EVENT_KINDS = { test:'📝 Test', homework:'📚 Homework', study:'📖 Study', other:'📌 Other', session:'🤝 Tutoring', pending:'⏳ Requested' };
// Everything with a date: my own events, booked sessions, and requests still waiting.
function calItems(){
  return [
    ...S.events,
    ...sessionsList().filter(x=>x.date).map(x=>({ id:x.id, date:x.date, time:x.time, course:x.course, kind:'session', title:(x.role==='tutor'?'Tutoring ':'Session with ')+x.with, fixed:true })),
    ...S.myRequests.filter(r=>r.date && r.status==='pending').map(r=>({ id:r.id, date:r.date, time:r.time, course:r.course, kind:'pending', title:'Waiting on '+r.tutor_alias, fixed:true })),
  ];
}
const byWhen = (a,b) => a.date.localeCompare(b.date) || (a.time||'').localeCompare(b.time||'');
function eventRow(e){
  return `<div class="evrow" style="--c:${courseColor(e.course)}">
    <div class="bar"></div>
    <div style="min-width:0">
      <div style="font-weight:800;font-size:14px">${esc(e.title)}</div>
      <div class="tiny">${esc(fmtDate(e.date))}${e.time?' · '+esc(e.time):''} · ${EVENT_KINDS[e.kind]||''}${e.course?' · '+esc(e.course):''}</div>
    </div>
    ${e.fixed ? '' : `<button class="del" title="Delete" onclick="deleteEvent('${e.id}')">✕</button>`}
  </div>`;
}
function renderCalendar(c){
  const now=new Date();
  S.cal = S.cal || { y:now.getFullYear(), m:now.getMonth(), sel:ymd(now) };
  const { y, m, sel } = S.cal;
  const first = new Date(y, m, 1);
  const start = addDays(first, -first.getDay());
  const items = calItems();
  const today = ymd(now);
  let cells='';
  for(let i=0;i<42;i++){
    const d=addDays(start,i), k=ymd(d);
    if(i>=35 && d.getMonth()!==m) break;   // drop a sixth row that is all next month
    const evs=items.filter(e=>e.date===k).sort(byWhen);
    cells += `<button class="day ${d.getMonth()!==m?'out':''} ${k===today?'today':''} ${k===sel?'sel':''}" onclick="S.cal.sel='${k}'; render()">
      <span class="n">${d.getDate()}</span>
      ${evs.slice(0,2).map(e=>`<div class="ev" style="--c:${courseColor(e.course)}">${esc(e.title)}</div>`).join('')}
      ${evs.length>2?`<div class="more">+${evs.length-2} more</div>`:''}
    </button>`;
  }
  const dayEvs = items.filter(e=>e.date===sel).sort(byWhen);
  c.innerHTML = `
    <div class="calhead">
      <h3>${MONTHS[m]} ${y}</h3>
      <button onclick="calMove(-1)" aria-label="Previous month">‹</button>
      <button onclick="S.cal={y:${now.getFullYear()},m:${now.getMonth()},sel:'${today}'}; render()">Today</button>
      <button onclick="calMove(1)" aria-label="Next month">›</button>
    </div>
    <div class="cal">
      ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="dow">${d}</div>`).join('')}
      ${cells}
    </div>

    <div class="cols" style="margin-top:16px">
      <div>
        <div class="sectlabel">${esc(parseYmd(sel).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}))}</div>
        <div class="card">${dayEvs.length ? dayEvs.map(eventRow).join('') : `<div class="tiny" style="text-align:center;padding:8px">Nothing on this day.</div>`}</div>
      </div>
      <div>
        <div class="sectlabel">Add to this day</div>
        <div class="card">
          <div class="field"><label>What</label><input id="ev_title" placeholder="e.g. Unit 3 test" onkeydown="if(event.key==='Enter')addEvent()"></div>
          <div class="row" style="gap:10px">
            <div class="field" style="flex:1"><label>Type</label><select id="ev_kind">
              ${['test','homework','study','other'].map(k=>`<option value="${k}">${EVENT_KINDS[k]}</option>`).join('')}</select></div>
            <div class="field" style="flex:1"><label>Time</label><input id="ev_time" type="time"></div>
          </div>
          <div class="field"><label>Class</label><select id="ev_course">
            <option value="">No class</option>
            ${S[classKey()].map(x=>`<option>${esc(x)}</option>`).join('')}</select></div>
          <button class="btn" onclick="addEvent()">Add to calendar</button>
        </div>
      </div>
    </div>
  `;
}
function calMove(n){
  let { y, m } = S.cal; m+=n;
  if(m<0){ m=11; y--; } if(m>11){ m=0; y++; }
  S.cal = { y, m, sel: ymd(new Date(y,m,1)) };
  render();
}
function addEvent(){
  const title=$('ev_title').value.trim();
  if(!title){ $('ev_title').focus(); return; }
  const t=$('ev_time').value;
  const time = t ? new Date('2000-01-01T'+t).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}) : '';
  const ev={ id:uid(), user_id:A.user.id, date:S.cal.sel, time, title, kind:$('ev_kind').value, course:$('ev_course').value };
  S.events.push(ev);
  render(); toast('Added to '+fmtDate(S.cal.sel));
  sbFetch('/rest/v1/sl_events', { method:'POST', body:JSON.stringify({ user_id:ev.user_id, date:ev.date, time, title, kind:ev.kind, course:ev.course }) })
    .then(function(rows){ if(rows && rows[0]) ev.id = rows[0].id; })
    .catch(function(e){ toast(e.message); loadData().then(render); });
}
function deleteEvent(id){
  S.events=S.events.filter(e=>e.id!==id);
  render();
  sbFetch('/rest/v1/sl_events?id=eq.'+id, { method:'DELETE', headers:{ Prefer:'return=minimal' } }).catch(function(e){ toast(e.message); loadData().then(render); });
}

// Status changes go to the server, then everything reloads so both sides agree.
function patchRequest(id, patch, okMsg){
  return sbFetch('/rest/v1/sl_requests?id=eq.'+id, { method:'PATCH', headers:{ Prefer:'return=minimal' }, body:JSON.stringify(patch) })
    .then(loadData).then(function(){ render(); if(okMsg) toast(okMsg); })
    .catch(function(e){ toast(e.message); });
}
function cancelRequest(id){ patchRequest(id, { status:'cancelled' }, 'Request cancelled'); }
function respondRequest(id, accept){
  const r=S.incoming.find(x=>x.id===id); if(!r)return;
  patchRequest(id, { status: accept ? 'accepted' : 'declined' }, accept ? 'Session confirmed with '+r.student_alias+' ✅' : 'Request declined');
}
function completeSession(id){
  patchRequest(id, { status:'done', done_at:new Date().toISOString() }, 'Logged 0.75 service hours 🎉');
}

function toggleTutorCourse(course){ const d=S.overlay.draft; if(d.courses[course])delete d.courses[course]; else d.courses[course]={grade:'A',year:'2024–25'}; render(); }
function d_grade(course,v){ S.overlay.draft.courses[course].grade=v; }
function d_year(course,v){ S.overlay.draft.courses[course].year=v; }
async function finishTutor(){
  const d=S.overlay.draft, me=A.user.id;
  const avail=$('av')?$('av').value.trim():d.avail;
  const bio=$('bio')?$('bio').value.trim():d.bio;
  const btn=$('ft_btn'); if(btn){ btn.disabled=true; btn.textContent='Saving…'; }
  try{
    await ensureTutorAlias();
    await sbFetch('/rest/v1/sl_profiles?id=eq.'+me, { method:'PATCH', headers:{ Prefer:'return=minimal' }, body:JSON.stringify({ tutor_bio:bio, tutor_format:d.format }) });
    await sbFetch('/rest/v1/sl_tutor_courses?user_id=eq.'+me, { method:'DELETE', headers:{ Prefer:'return=minimal' } });
    const rows=Object.entries(d.courses).map(([course,v])=>({ user_id:me, course, grade:v.grade, year:v.year, availability:avail }));
    if(rows.length) await sbFetch('/rest/v1/sl_tutor_courses', { method:'POST', headers:{ Prefer:'return=minimal' }, body:JSON.stringify(rows) });
    // Each grade goes to an administrator to check. A grade already verified
    // at the same mark is left alone; anything else is submitted afresh.
    const have = await sbFetch('/rest/v1/sl_grades?select=id,course,grade,status&user_id=eq.'+me);
    const keep = new Set((have||[]).filter(g=>g.status==='verified' && d.courses[g.course] && d.courses[g.course].grade===g.grade).map(g=>g.id));
    const stale = (have||[]).filter(g=>!keep.has(g.id) && g.status==='pending').map(g=>g.id);
    if(stale.length) await sbFetch('/rest/v1/sl_grades?id=in.('+stale.join(',')+')', { method:'DELETE', headers:{ Prefer:'return=minimal' } });
    const submit = rows.filter(r => !(have||[]).some(g => keep.has(g.id) && g.course===r.course)).map(r=>({ user_id:me, course:r.course, grade:r.grade, year:r.year }));
    if(submit.length) await sbFetch('/rest/v1/sl_grades', { method:'POST', headers:{ Prefer:'return=minimal' }, body:JSON.stringify(submit) });
    await loadData();
    S.mode='tutor'; A.role='tutor'; S.me.name=currentAlias();
    closeView(); go('tutoring');
    toast('You\'re now tutoring as '+A.profile.tutor_alias+' 🎓');
  }catch(e){
    toast(e.message); if(btn){ btn.disabled=false; btn.textContent='Finish — start tutoring'; }
  }
}

function filterMembers(){

function addMember(){
  const name=($('mb_name').value||'').trim(), email=($('mb_email').value||'').trim().toLowerCase(), grade=$('mb_grade').value, role=$('mb_role').value;
  if(!name){ $('mb_name').focus(); return; }

  const btn=$('mb_add'); if(btn){ btn.disabled=true; btn.textContent='Adding…'; }
  sbFetch('/rest/v1/sl_staff', { method:'POST', headers:{ Prefer:'return=representation,resolution=merge-duplicates' }, body:JSON.stringify({ email, real_name:name, grade_level: grade ? Number(grade) : null, role, added_by:A.user.id, added_by_alias:A.profile.student_alias, join_code:makeCode() }) })
    .then(function(rows){ const r = rows && rows[0]; toast(r && r.join_code ? name + ' added · code ' + r.join_code : name + ' added'); render(); })
    .catch(function(e){ toast(e.message); if(btn){ btn.disabled=false; btn.textContent='Add'; } });

// Codes are made here and stored on the approval row; the join function
// checks them. Unambiguous letters and digits, four and four.
function makeCode(){
  const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789', b=new Uint8Array(8); crypto.getRandomValues(b);
  const c=Array.from(b, x=>a[x%a.length]).join(''); return c.slice(0,4)+'-'+c.slice(4);
}
function copyCode(code, btn){
  if(!code) return;
  const done=function(){ toast('Code '+code+' copied'); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done, done); else done();
}
function newCode(email){
  const code=makeCode();
  sbFetch('/rest/v1/sl_staff?email=eq.'+encodeURIComponent(email), { method:'PATCH', headers:{ Prefer:'return=minimal' }, body:JSON.stringify({ join_code:code, code_created_at:new Date().toISOString(), code_used_at:null }) })
    .then(function(){ toast('New code for '+email+': '+code); render(); }).catch(function(e){ toast(e.message); });
}
// Level, name and grade are edited on the approval row; a trigger carries the

}
function saveMember(email){

  sbFetch('/rest/v1/sl_staff?email=eq.'+encodeURIComponent(email), { method:'PATCH', headers:{ Prefer:'return=minimal' }, body:JSON.stringify({ real_name, grade_level: g ? Number(g) : null }) })

function removeMember(email){

// After the alias screen: straight in if a session is already saved.
function finishIssued(){
  A.authView = 'signin'; A.authMsg = ''; A.authOk = '';
  if(A.token){ loadProfile().then(render).catch(function(){ render(); }); } else render();
}
async function doSetPassword(){
  const a = ($('np_pass')||{}).value || '', b = ($('np_pass2')||{}).value || '';
  if(a.length < 6){ A.authMsg = 'Passwords must be at least 6 characters.'; return render(); }
  if(a !== b){ A.authMsg = 'Those two do not match.'; return render(); }
  A.authBusy = true; A.authMsg = ''; render();
  try {
    await sbFetch('/auth/v1/user', { method:'PUT', body: JSON.stringify({ password: a }) });
    A.authBusy = false;
    const alias = await ensureProfile();      // first arrival: issue the alias
    if(alias){ A.signedUpAlias = alias; A.authView = 'issued'; A.profile = null; }
    else { A.authView = 'signin'; }
    render();
  } catch(e){
    A.authBusy = false;
    A.authMsg = /approved/i.test(e.message) ? 'This email address has not been approved by the school.' : e.message;
    render();
  }
}
// An invite or reset email lands here with tokens in the URL fragment.
async function consumeAuthLink(){
  const h = location.hash || '';
  if(h.indexOf('access_token=') < 0) return false;
  const q = new URLSearchParams(h.replace(/^#/, ''));
  const token = q.get('access_token'), type = q.get('type') || '';
  history.replaceState(null, '', location.pathname + location.search);
  if(!token) return false;
  try {
    A.token = token;
    const user = await sbFetch('/auth/v1/user');
    A.user = user; saveSession(); dataLoaded = false;
    A.linkType = type; A.profile = null;
    if(type === 'recovery' || type === 'invite'){ A.authView = 'setpw'; return true; }
    // Email confirmed after sign-up: the password is already set, so issue the alias.
    const alias = await ensureProfile();
    if(alias){ A.signedUpAlias = alias; A.authView = 'issued'; A.profile = null; }
    return true;
  } catch(e){ clearSession(); A.authMsg = 'That link has expired. Ask for a new one.'; return false; }
}

// Switch between the sign-in views, clearing any message from the last one.
function authGo(view){ A.authView = view; A.authMsg = ''; A.authOk = ''; A.draft = null; render(); }

// Enter submits; the first empty field gets focus.
function wireAuthForm(submit, firstId){
  const card = document.querySelector('.auth-card'); if(!card) return;
  card.querySelectorAll('input').forEach(function(el){
    el.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); window[submit](); } });
  });
  const empty = Array.from(card.querySelectorAll('input')).find(function(el){ return !el.value; }) || document.getElementById(firstId);
  if(empty) setTimeout(function(){ empty.focus(); }, 0);
}

function togglePw(id, btn){
  const el = document.getElementById(id); if(!el) return;
  const show = el.type === 'password';
  el.type = show ? 'text' : 'password'; btn.textContent = show ? 'Hide' : 'Show';
  el.focus();
}

// What was typed survives a re-render (an error, or the busy state).
function keepDraft(ids){
  A.draft = {};
  ids.forEach(function(id){ const el = document.getElementById(id); if(el) A.draft[id] = el.value; });
}

async function doSignIn(){
  const u = (document.getElementById('si_user')||{}).value || '';
  const p = (document.getElementById('si_pass')||{}).value || '';
  keepDraft(['si_user']);
  if(!u.trim() || !p){ A.authMsg = 'Please enter your alias and password.'; return render(); }
  A.authBusy = true; A.authMsg = ''; A.authOk = ''; render();
  try {
    const newAlias = await signIn(u, p);
    A.authBusy = false; A.draft = null;
    // Only set on the very first sign-in, when the profile was just created.
    if(newAlias){ A.signedUpAlias = newAlias; A.authView = 'issued'; A.profile = null; }
    render();
  }
  catch(e){
    A.authBusy = false;
    A.authMsg = /Invalid/i.test(e.message) ? 'That alias and password do not match.' : e.message;
    render();
  }
}

async function doSignUp(){
  const g = function(id){ return ((document.getElementById(id)||{}).value || '').trim(); };
  const email = g('su_email').toLowerCase(), code = g('su_code'), pass = g('su_pass');
  keepDraft(['su_email','su_code']);

  if(pass.length < 6){ A.authMsg = 'Passwords must be at least 6 characters.'; return render(); }
  A.authBusy = true; A.authMsg = ''; A.authOk = ''; render();
  try {
    // The join function checks the code and creates the account; then we sign
    // straight in with the password just chosen, and the alias is issued.
    await sbFetch('/functions/v1/sl-join', { method:'POST', body: JSON.stringify({ email, code, password: pass }) });
    const alias = await signIn(email, pass);
    A.authBusy = false; A.draft = null;
    if(alias){ A.signedUpAlias = alias; A.authView = 'issued'; A.profile = null; }
    else { A.authView = 'signin'; }
    render();
  }
  catch(e){
    A.authBusy = false;
    A.authMsg = /rate limit/i.test(e.message) ? 'Too many attempts right now. Try again in a little while.' : e.message;
    render();
  }
}

async function doReset(){

}

function clearSession(){ try{ localStorage.removeItem(AUTH_LS); }catch(e){} A.token=null; A.user=null; A.profile=null; }

async function loadProfile(){
  const rows = await sbFetch('/rest/v1/sl_profiles?select=*&id=eq.' + A.user.id);
  A.profile = rows && rows[0] ? rows[0] : null;
  // The app knows you by whichever alias fits what you're currently doing.
  if(A.profile){
    S.me.name  = currentAlias();
    S.me.grade = A.profile.grade_level || S.me.grade;
  }
}

async function signIn(idOrEmail, password){
  // You sign in with your alias. The email behind it is resolved server-side by
  // sl_login_email, which checks the password before returning anything — so
  // aliases, which are public by design, can't be used to harvest addresses.
  let email = idOrEmail.trim();
  if(!email.includes('@')){
    const found = await sbFetch('/rest/v1/rpc/sl_login_email', {
      method:'POST', headers:{ Authorization:'Bearer ' + SKEY },
      body: JSON.stringify({ p_alias: email, p_password: password })
    });
    if(!found) throw new Error('Invalid login credentials');
    email = found;
  }
  const d = await sbFetch('/auth/v1/token?grant_type=password', {
    method:'POST', headers:{ Authorization:'Bearer ' + SKEY },
    body: JSON.stringify({ email, password })
  });
  A.token = d.access_token; A.user = d.user; saveSession(); dataLoaded = false;
  return await ensureProfile();   // issues the alias if this is their first sign-in
}

async function signUp({ email, password, realName, gradeLevel }){
  // Create the account first. The alias used to be claimed before this, which
  // burned a Student number every time a signup failed and showed an error
  // where the alias should have been.
  const d = await sbFetch('/auth/v1/signup', {
    method:'POST', headers:{ Authorization:'Bearer ' + SKEY },
    body: JSON.stringify({
      email: email.trim(), password,
      data: { real_name: realName.trim(), grade_level: Number(gradeLevel) || null }
    })
  });
  A.token = d.access_token || (d.session && d.session.access_token);
  A.user  = d.user || (d.session && d.session.user);
  // No session means email confirmation is on. The account exists, but nothing
  // can be written as them until they confirm and sign in, so the alias is
  // issued then instead.
  if(!A.token) return null;
  saveSession();
  return await ensureProfile();
}

// Give this account a profile and a student number if it doesn't have one yet.
// Runs on first sign-in as well as after signup, so it works whether or not
// email confirmation is switched on.
async function ensureProfile(){
  await loadProfile();
  if(A.profile) return null;
  const alias = await sbFetch('/rest/v1/rpc/sl_next_alias', {
    method:'POST', body: JSON.stringify({ kind:'student' })
  });
  const meta = (A.user && A.user.user_metadata) || {};
  await sbFetch('/rest/v1/sl_profiles', {
    method:'POST', headers:{ Prefer:'return=minimal' },
    body: JSON.stringify({
      id: A.user.id,
      real_name: meta.real_name || 'Unknown',
      grade_level: meta.grade_level || null,
      student_alias: alias
    })
  });
  await loadProfile();
  return alias;   // non-null only the first time, so the alias screen shows once
}

// Claim a tutor alias the first time someone offers to tutor, so their two
// identities are separate numbers that can't be matched to each other.
async function ensureTutorAlias(){
  if(A.profile && A.profile.tutor_alias) return A.profile.tutor_alias;
  const alias = await sbFetch('/rest/v1/rpc/sl_next_alias', {
    method:'POST', body: JSON.stringify({ kind:'tutor' })
  });
  await sbFetch('/rest/v1/sl_profiles?id=eq.' + A.user.id, {
    method:'PATCH', headers:{ Prefer:'return=minimal' },
    body: JSON.stringify({ tutor_alias: alias })
  });
  await loadProfile();
  return alias;
}

async function sendReset(email){
  await sbFetch('/auth/v1/recover?redirect_to=' + encodeURIComponent(APP_URL), {
    method:'POST', headers:{ Authorization:'Bearer ' + SKEY },
    body: JSON.stringify({ email: email.trim() })
  });
}

async function restoreSession(){
  try{
    const raw = localStorage.getItem(AUTH_LS); if(!raw) return false;
    const s = JSON.parse(raw); if(!s || !s.token) return false;
    A.token = s.token; A.user = s.user; dataLoaded = false;
    await loadProfile();
    return !!A.profile;
  }catch(e){ clearSession(); return false; }
}
function signOut(){
  clearSession(); dataLoaded=false; A.role='student';
  Object.assign(S, { myRequests:[], incoming:[], posts:[], tutors:[], myClasses:[], tutorClasses:[], events:[], hours:0, helped:0, tab:'home', overlay:null });
  S.me = { name:'You', grade:11, isTutor:false, tutorCourses:[], avail:'' };
  A.authView='signin'; render();
}

/* ============================= DATA (server) ============================= */
// Everything the signed-in person can see, loaded after sign-in and again
// after any change. A school's worth of rows is small; no paging needed.
let dataLoaded = false, dataLoading = false, dataError = null;
async function loadData(){
  if(!A.user) return;
  const me = A.user.id;
  const [classes, tcourses, reqs, events, tutors, posts, myGrades, pendingGrades] = await Promise.all([
    sbFetch('/rest/v1/sl_student_classes?select=course&user_id=eq.'+me+'&order=created_at'),
    sbFetch('/rest/v1/sl_tutor_courses?select=course,grade,year,availability&user_id=eq.'+me+'&order=created_at'),
    sbFetch('/rest/v1/sl_requests?select=*&or=(student_id.eq.'+me+',tutor_id.eq.'+me+')&order=created_at.desc'),
    sbFetch('/rest/v1/sl_events?select=*&user_id=eq.'+me+'&order=date'),
    sbFetch('/rest/v1/sl_tutors?select=*'),
    sbFetch('/rest/v1/sl_posts?select=*&order=created_at.desc&limit=500'),
    sbFetch('/rest/v1/sl_grades?select=course,grade,status&user_id=eq.'+me),
    isStaff() ? sbFetch('/rest/v1/sl_grades?select=id&status=eq.pending') : Promise.resolve([]),
  ]);
  S.myClasses = (classes||[]).map(r=>r.course);
  S.tutorClasses = (tcourses||[]).map(r=>r.course);
  S.me.tutorCourses = (tcourses||[]).map(r=>{ const g=(myGrades||[]).find(x=>x.course===r.course); return { course:r.course, grade:r.grade||'', year:r.year||'', verify: g ? g.status : 'none' }; });
  S.pendingGrades = (pendingGrades||[]).length;
  S.me.avail = ((tcourses||[]).find(r=>r.availability)||{}).availability || '';
  S.me.isTutor = !!(A.profile && A.profile.tutor_alias) && S.tutorClasses.length > 0;
  S.myRequests = (reqs||[]).filter(r=>r.student_id===me);
  S.incoming = (reqs||[]).filter(r=>r.tutor_id===me);
  S.events = events||[];
  S.posts = posts||[];
  S.tutors = buildTutors(tutors||[], me);
  S.helped = S.incoming.filter(r=>r.status==='done').length;
  S.hours = Math.round(S.helped*0.75*100)/100;
  if(S.mode==='tutor' && !(A.profile && A.profile.tutor_alias)) S.mode='tutee';
  A.role = (S.mode==='tutor' && A.profile && A.profile.tutor_alias) ? 'tutor' : 'student';
  S.me.name = currentAlias();
  dataLoaded = true;
}
// One row per class per tutor comes back; fold them into one tutor each.
function buildTutors(rows, me){
  const by = {};
  rows.forEach(function(r){
    if(r.user_id===me) return;
    const t = by[r.user_id] || (by[r.user_id] = { id:r.user_id, name:r.tutor_alias, grade:r.grade_level, bio:r.tutor_bio||'', format:r.tutor_format||'In person',
      avail:'', sessions:Number(r.sessions_done)||0, courses:[], color:TUTOR_COLORS[hashStr(r.user_id)%TUTOR_COLORS.length] });
    t.courses.push({ course:r.course, grade:r.grade||'', year:r.year||'', verified:!!r.verified });
    if(r.availability && !t.avail) t.avail = r.availability;
  });
  return Object.values(by);
}
// Pick up what other people did while this tab was in the background.
document.addEventListener('visibilitychange', function(){ if(!document.hidden && A.profile && dataLoaded) loadData().then(function(){ if(!S.overlay) render(); }).catch(function(){}); });
setInterval(function(){ if(!document.hidden && A.profile && dataLoaded) loadData().then(function(){ if(!S.overlay) render(); }).catch(function(){}); }, 60000);

/* ============================= INIT ============================= */
load();
consumeAuthLink().then(function(fromLink){ return fromLink ? null : restoreSession(); }).then(function(){ render(); });
</script>
