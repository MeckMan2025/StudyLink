<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SilverCircle — Peer Tutoring</title>
<style>
  :root{
    --bg:#eef2fb; --card:#ffffff; --ink:#2f3350; --muted:#8b8fa8; --line:#eceaf5;
    --blue:#7aa7f0; --blue-d:#4d7fd6; --pink:#f28fb4; --pink-d:#e0679a;
    --purple:#a78be6; --green:#63c39a; --orange:#f0a868; --star:#f5b942;
    --good:#3fae7a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--ink); min-height:100vh;
  }
  /* App shell — a sidebar like ETS, content on the right */
  .app{min-height:100vh}
  .side{
    position:fixed; top:0; left:0; bottom:0; width:256px; z-index:40;
    background:rgba(255,255,255,.94); backdrop-filter:blur(8px);
    box-shadow:0 0 24px rgba(60,50,110,.10); display:flex; flex-direction:column;
    transform:translateX(-100%); transition:transform .25s ease;
  }
  .app.open .side{transform:none}
  .scrim{position:fixed; inset:0; background:rgba(0,0,0,.3); z-index:30; display:none}
  .app.open .scrim{display:block}
  .side .shead{display:flex; align-items:center; gap:9px; padding:16px; border-bottom:1px solid var(--line)}
  .side .shead .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--blue),var(--purple));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:16px}
  .side .shead b{font-size:17px; font-weight:800}
  .side .shead{position:relative}
  .side .shead .dots{margin-left:auto; border:none; background:none; font-size:20px; font-weight:900; color:var(--muted); cursor:pointer; width:32px; height:32px; border-radius:8px}
  .side .shead .dots:hover{background:#eef0f6}
  .menuscrim{position:fixed; inset:0; z-index:44}
  .menu-pop{position:absolute; top:52px; right:10px; z-index:45; width:190px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:6px; box-shadow:0 12px 32px rgba(60,50,110,.18)}
  .menu-pop hr{margin:4px}
  .side .shead .x{ border:none; background:none; font-size:20px; color:var(--muted); cursor:pointer; padding:2px 6px; border-radius:6px}
  .modes{display:flex; gap:4px; margin:10px 10px 2px; background:#eef0f6; padding:4px; border-radius:11px}
  .modes button{flex:1; border:0; background:transparent; padding:8px 0; border-radius:8px; font:inherit; font-size:13.5px; font-weight:700; color:#6b7088; cursor:pointer}
  .modes button.on{background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(20,25,40,.14)}
  .side nav{flex:1; overflow-y:auto; padding:8px}
  .nitem{display:flex; align-items:center; gap:10px; width:100%; border:none; background:none; cursor:pointer;
    padding:9px 12px; border-radius:10px; font:inherit; font-size:14.5px; font-weight:600; color:#5b6077; text-align:left}
  .nitem:hover{background:#e3ecfd}
  .nitem.on{background:#fcdbe8; color:var(--ink)}
  .nitem .ic{width:20px; text-align:center; font-size:16px}
  .nitem .chev{margin-left:auto; color:var(--muted); font-size:12px; transition:transform .2s}
  .nitem .chev.down{transform:rotate(90deg)}
  .nitem .count{margin-left:auto; background:var(--pink-d); color:#fff; font-size:10.5px; font-weight:800; border-radius:9px; padding:1px 7px}
  .sub{padding:2px 0 4px 18px}
  .sub .nitem{font-size:13.5px; padding:7px 10px}
  .sub .dot{width:9px; height:9px; border-radius:50%; flex:0 0 auto}
  .sub .add{color:var(--blue-d)}
  .side hr{border:none; border-top:1px solid var(--line); margin:8px 4px}
  .side .sfoot{border-top:1px solid var(--line); padding:12px}
  .side .who{display:flex; align-items:center; gap:10px; margin-bottom:2px}
  .side .who .avatar{width:34px;height:34px;font-size:13px}

  .main{min-height:100vh; display:flex; flex-direction:column}
  .head{
    position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:10px;
    padding:12px 18px; background:rgba(238,242,251,.9); backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
  }
  .head .menu{border:none; background:#fff; border-radius:10px; width:38px; height:38px; font-size:18px; cursor:pointer; box-shadow:0 2px 8px rgba(60,50,110,.12)}
  .head h1{font-size:17px; margin:0; font-weight:800}
  .head .right{margin-left:auto; font-size:12px; color:var(--muted); font-weight:700; text-align:right}
  .scroll{flex:1; width:100%; max-width:980px; margin:0 auto; padding:18px 18px 60px}

  @media (min-width:900px){
    .side{transform:none}
    .side .shead .x, .head .menu, .scrim{display:none !important}
    .main{margin-left:256px}
  }

  /* Grids */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px}
  .grid .card + .card{margin-top:0}
  .classcard{cursor:pointer; position:relative; border-top:5px solid var(--c)}
  .classcard .rm{position:absolute; top:8px; right:8px; border:none; background:#f3f1f9; color:var(--muted); width:26px; height:26px; border-radius:50%; cursor:pointer; font-size:14px}
  .addcard{display:flex; align-items:center; justify-content:center; gap:8px; min-height:96px; cursor:pointer; border:2px dashed #d6dcf0; background:transparent; box-shadow:none; color:var(--blue-d); font-weight:800}
  .cols{display:grid; grid-template-columns:1fr; gap:16px}
  @media (min-width:760px){ .cols{grid-template-columns:3fr 2fr} .cols.even{grid-template-columns:1fr 1fr} }
  /* Side-by-side cards end on the same line, whichever list is longer */
  .cols.even > div{display:flex; flex-direction:column}
  .cols.even > div > .card:last-child{flex:1}

  /* Calendar */
  .calhead{display:flex; align-items:center; gap:8px; margin-bottom:10px}
  .calhead h3{margin:0; font-size:18px; font-weight:800; flex:1}
  .calhead button{border:1px solid var(--line); background:#fff; border-radius:10px; padding:7px 12px; font-weight:800; cursor:pointer; color:var(--ink)}
  .cal{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
  .cal .dow{font-size:11px; font-weight:800; color:var(--muted); text-align:center; padding:4px 0; text-transform:uppercase}
  .cal .day{background:#fff; border:1px solid var(--line); border-radius:10px; min-height:84px; padding:5px; cursor:pointer; overflow:hidden; text-align:left; font:inherit; color:var(--ink); display:flex; flex-direction:column; justify-content:flex-start; min-width:0}
  .pencil{border:none; background:#f2f0fb; border-radius:8px; width:28px; height:28px; cursor:pointer; font-size:13px; margin-left:auto}
  .pencil:hover{background:#e3ecfd}
  .freesqs{display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:5px}
  .freesq{border:1px solid #cdebd9; background:#f1faf5; border-radius:9px; padding:5px 2px; min-height:52px; display:flex; flex-direction:column; align-items:center; gap:1px; cursor:pointer; font:inherit; min-width:0}
  .freesq:hover{border-color:#9fd8b9}
  .freesq .d{font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.3px; color:var(--ink); margin-bottom:2px}
  .freesq .t{font-size:9.5px; font-weight:700; color:#2e9b6a; white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis}
  .freesq.none{background:#f6f5fa; border-color:var(--line)}
  .freesq.none .t{color:var(--muted)}
  .freesq.today{box-shadow:0 0 0 2px #dbe5fb}
  .periodrow{display:flex; align-items:center; gap:6px; padding:6px 0; border-bottom:1px solid var(--line); flex-wrap:wrap}
  .periodrow input{padding:8px 9px; border:1.5px solid #e5e2f0; border-radius:9px; font:inherit; font-size:14px; color:var(--ink); background:#fff}
  .periodrow input:first-child{flex:1; min-width:110px; font-weight:700}
  .periodrow .del{border:none; background:none; color:var(--muted); cursor:pointer; font-size:16px; margin-left:auto}
  .chat{display:flex; flex-direction:column; gap:6px; max-height:52vh; overflow-y:auto; padding:4px 2px}
  .msg{max-width:78%; padding:8px 12px; border-radius:14px; font-size:14px; line-height:1.4; background:#fff; border:1px solid var(--line); align-self:flex-start}
  .msg.me{align-self:flex-end; background:#e3ecfd; border-color:#d3e0fb}
  .msg .t{font-size:10.5px; color:var(--muted); font-weight:700; margin-top:2px}
  .msg.sys{align-self:center; background:none; border:none; color:var(--muted); font-size:12px; font-weight:700; text-align:center}
  .acts{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}
  .acts button{border:1px solid var(--line); background:#fff; border-radius:9px; padding:6px 10px; font:inherit; font-size:12.5px; font-weight:800; color:var(--blue-d); cursor:pointer}
  .cal .day{position:relative}
  .cal .day .plus{position:absolute; top:4px; right:4px; width:24px; height:24px; border-radius:50%; border:none; cursor:pointer;
    background:#f2f0fb; color:var(--muted); font-size:16px; font-weight:800; line-height:1; display:flex; align-items:center; justify-content:center}
  .cal .day:hover .plus, .cal .day .plus:focus-visible{background:var(--blue-d); color:#fff}
  @media (max-width:600px){ .cal .day .plus{width:18px; height:18px; font-size:13px; top:2px; right:2px} }
  .dm-back{position:fixed; inset:0; background:rgba(30,30,60,.35); z-index:60; display:flex; align-items:center; justify-content:center; padding:16px}
  .dm{background:var(--bg); border-radius:18px; width:100%; max-width:520px; max-height:88vh; overflow-y:auto; padding:16px; box-shadow:0 20px 60px rgba(30,30,60,.3)}
  .dm .dmhead{display:flex; align-items:center; gap:8px; margin-bottom:10px}
  .dm .dmhead h3{margin:0; font-size:18px; font-weight:800; flex:1}
  .dm .dmhead button{border:none; background:#fff; width:32px; height:32px; border-radius:50%; font-size:16px; color:var(--muted); cursor:pointer}
  .cal .day.out{opacity:.4}
  .cal .day.today .n{background:var(--blue-d); color:#fff}
  .cal .day.sel{border-color:var(--purple); box-shadow:0 0 0 2px #e4dcfa}
  .cal .day .n{align-self:flex-start; display:inline-flex; width:24px; height:24px; align-items:center; justify-content:center; border-radius:50%; font-size:12.5px; font-weight:800}
  .cal .ev{font-size:10.5px; font-weight:700; padding:2px 5px; border-radius:6px; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; background:#f2f0fb; border-left:3px solid var(--c)}
  .cal .more{font-size:10px; color:var(--muted); font-weight:700; margin-top:2px}
  @media (max-width:600px){
    .cal .day{min-height:52px}
    .cal .ev{font-size:0; padding:0; height:6px; border-left:none; background:var(--c)}
    .cal .more{display:none}
  }
  .evrow{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line)}
  .evrow:last-child{border-bottom:none}
  .evrow .bar{width:4px; align-self:stretch; border-radius:3px; background:var(--c)}
  .evrow .del{margin-left:auto; border:none; background:none; color:var(--muted); cursor:pointer; font-size:16px}

  /* Sign-in: a centred card, no sidebar or header behind it */
  .app.auth .side,.app.auth .scrim,.app.auth .head{display:none !important}
  .app.auth .main{margin-left:0}
  .app.auth .scroll{max-width:none; padding:0}
  .auth-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:28px 16px;
    background:radial-gradient(900px 520px at 15% -10%, #dde8fd 0%, transparent 60%), radial-gradient(800px 520px at 100% 110%, #fbe3ee 0%, transparent 60%), var(--bg)}
  .auth-card{width:100%; max-width:400px; background:#fff; border:1px solid var(--line); border-radius:22px; padding:28px 24px 22px; box-shadow:0 22px 60px rgba(60,50,110,.14)}
  .auth-logo{width:58px; height:58px; border-radius:17px; background:linear-gradient(135deg,var(--blue),var(--purple)); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:900; font-size:28px; margin:0 auto 12px; box-shadow:0 10px 22px rgba(120,100,220,.28)}
  .auth-card h2{margin:0; text-align:center; font-size:24px; font-weight:800; letter-spacing:.2px}
  .auth-card .lead{text-align:center; margin:4px 0 18px}
  .auth-card .field:last-child{margin-bottom:0}
  .pw{position:relative}
  .pw input{padding-right:58px}
  .pw .eye{position:absolute; right:6px; top:50%; transform:translateY(-50%); border:none; background:none; cursor:pointer; color:var(--blue-d); font:inherit; font-size:12px; font-weight:800; padding:6px 8px; border-radius:8px}
  .pw .eye:hover{background:#eef2fb}
  .auth-msg{margin-top:12px; border-radius:11px; padding:10px 12px; font-size:13px; font-weight:700; line-height:1.35}
  .auth-msg.err{background:#fdecef; color:#c23b5e}
  .auth-msg.ok{background:#e6f6ee; color:#2f8a5e}
  .auth-card .btn{margin-top:16px}
  .auth-links{display:flex; justify-content:space-between; gap:10px; margin-top:14px}
  .auth-links button{border:none; background:none; cursor:pointer; font:inherit; font-size:13px; font-weight:800; color:var(--blue-d); padding:4px 0}
  .auth-links button:hover{text-decoration:underline}
  .auth-links.center{justify-content:center}
  .auth-alias{margin:14px 0 4px; text-align:center; background:linear-gradient(135deg,#eaf0fe,#f6edf8); border-radius:16px; padding:20px 14px}
  .auth-alias .big{font-size:32px; font-weight:800; margin:6px 0 4px; color:var(--ink)}
  .auth-foot{text-align:center; margin-top:18px; font-size:11.5px; color:var(--muted); font-weight:600}

  /* Roles */
  .rolebadge{display:inline-block; font-size:10.5px; font-weight:800; letter-spacing:.4px; text-transform:uppercase; padding:2px 8px; border-radius:8px; vertical-align:middle}
  .rolebadge.admin{background:#e6eefb; color:#4d7fd6}
  .rolebadge.board{background:#f1e9fd; color:#7c5fd0}
  .verified{display:inline-block; font-size:11px; font-weight:800; color:#2e9b6a; background:#e4f6ec; border-radius:8px; padding:2px 7px; margin-left:6px}
  .unverified{display:inline-block; font-size:11px; font-weight:700; color:#c98b34; background:#fbf1e2; border-radius:8px; padding:2px 7px; margin-left:6px}
  .side .section{font-size:10.5px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); padding:6px 12px 2px}

  .mrow{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
  .mrow .ctl{margin-left:auto; display:flex; align-items:center; gap:6px; flex-wrap:wrap}
  .mrow select.lvl{padding:7px 10px; border:1.5px solid #e5e2f0; border-radius:10px; font:inherit; font-size:12.5px; font-weight:700; color:var(--ink); background:#fff}
  .mrow select.lvl:disabled{opacity:.6}
  .mrow .mini{border:1px solid #dbe3f7; background:#fff; color:var(--blue-d); border-radius:10px; padding:7px 10px; font:inherit; font-size:12.5px; font-weight:800; cursor:pointer}
  .mrow .mini.danger{color:#c23b5e; border-color:#f5d3dc}
  .mrow .mini:hover{background:#eef3fe}
  .mrow .mini.danger:hover{background:#fdecef}
  .medit{display:flex; gap:8px; flex-wrap:wrap; width:100%; margin-top:8px}
  .medit input,.medit select{padding:9px 11px; border:1.5px solid #e5e2f0; border-radius:10px; font:inherit; font-size:13.5px; background:#fff}
  .mrow .info{min-width:0; flex:1 1 220px}
  @media (max-width:640px){
    .mrow .ctl{flex-basis:100%; margin-left:0; padding-left:56px}
  }

  /* Home: this week at a glance, and the two session columns */
  .week{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
  .wday{background:#fff; border:1px solid var(--line); border-radius:12px; padding:8px 6px 7px; min-height:86px; cursor:pointer; text-align:center; font:inherit; color:var(--ink); display:flex; flex-direction:column; gap:4px; min-width:0}
  .wday:hover{border-color:#cdd7f3}
  .wday .dn{font-size:10px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; color:var(--muted)}
  .wday .dd{font-size:16px; font-weight:800; width:28px; height:28px; line-height:28px; border-radius:50%; margin:0 auto}
  .wday.today .dd{background:var(--blue-d); color:#fff}
  .wday.past{opacity:.6}
  .wday .wi{font-size:10px; font-weight:700; padding:2px 5px; border-radius:6px; background:#f2f0fb; border-left:3px solid var(--c); text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .wday .wi.sess{background:#e4f6ec}
  .wday .wi.pend{background:#fbf1e2}
  .wday .wi.busy{background:#fdecef; color:#c23b5e; border-left-color:#e7a1b3}
  .wday .wi.free{background:#e4f6ec; color:#2e9b6a; border-left-color:#9fd8b9}
  .wday .more{font-size:9.5px; color:var(--muted); font-weight:700}
  .sessrow{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line)}
  .sessrow:last-child{border-bottom:none}
  .sessrow .when{font-size:11px; font-weight:800; color:var(--blue-d); background:#eef3fe; border-radius:8px; padding:3px 7px; white-space:nowrap}
  .sessrow .who{font-weight:800; font-size:14px}
  .sessrow .meta{font-size:12px; color:var(--muted); font-weight:600}
  @media (max-width:600px){
    .wday{min-height:60px; padding:6px 3px}
    .wday .wi{font-size:0; height:6px; padding:0; border-left:none; background:var(--c)}
    .wday .more{display:none}
  }

  .sections{display:flex; gap:6px; background:#eef0f6; padding:4px; border-radius:12px; margin:12px 0 4px}
  .sections button{flex:1; border:0; background:transparent; padding:9px 0; border-radius:9px; font:inherit; font-size:13.5px; font-weight:800; color:#6b7088; cursor:pointer}
  .sections button.on{background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(20,25,40,.14)}
  .matrow{display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid var(--line)}
  .matrow:last-child{border-bottom:none}
  .matrow .ic{width:34px; height:34px; border-radius:10px; background:#eef3fe; display:flex; align-items:center; justify-content:center; font-size:16px; flex:0 0 auto}
  .matrow a{color:var(--blue-d); font-weight:800; text-decoration:none; word-break:break-word}
  .matrow a:hover{text-decoration:underline}

  .setup-card{max-width:620px}
  .progress{display:flex; gap:6px; margin:6px 0 16px}
  .progress span{flex:1; height:5px; border-radius:3px; background:#e6e9f4}
  .progress span.on{background:linear-gradient(90deg,var(--blue),var(--purple))}
  .bigopt{display:flex; align-items:center; gap:12px; width:100%; text-align:left; border:1.5px solid #e5e2f0; background:#fff; border-radius:14px; padding:12px 14px; font:inherit; cursor:pointer; margin-bottom:8px}
  .bigopt.on{border-color:var(--blue); background:#eef3fe}
  .bigopt .em{font-size:24px}
  .bigopt b{font-size:15px}
  .takenrow{display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); flex-wrap:wrap}
  .takenrow:last-child{border-bottom:none}
  .takenrow .nm{font-weight:800; font-size:14px; flex:1 1 140px}
  .takenrow select{padding:7px 9px; border:1.5px solid #e5e2f0; border-radius:9px; font:inherit; font-size:13px; background:#fff}

  /* Online status */
  .avwrap{position:relative; flex:0 0 auto}
  .avwrap .avatar{margin:0}
  .odot{position:absolute; right:-1px; bottom:-1px; width:12px; height:12px; border-radius:50%; background:#c7ccd9; border:2px solid #fff}
  .odot.on{background:#34c37a; box-shadow:0 0 0 2px rgba(52,195,122,.25)}
  .seen{font-size:11px; font-weight:700; color:var(--muted)}
  .seen.on{color:#2e9b6a}

  .avrow{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line)}
  .avrow:last-child{border-bottom:none}
  .avrow .tag{font-size:11px; font-weight:800; border-radius:8px; padding:3px 8px; white-space:nowrap}
  .avrow .tag.ok{background:#e4f6ec; color:#2e9b6a}
  .avrow .tag.no{background:#fdecef; color:#c23b5e}
  .cal .day.busy{background:#fdf3f5}
  .cal .day.free{background:#f3fbf6}
  .cal .ev.busyev{background:#fdecef; color:#c23b5e; border-left-color:#e7a1b3}
  .cal .ev.freeev{background:#e4f6ec; color:#2e9b6a; border-left-color:#9fd8b9}
  @media (max-width:600px){ .cal .ev.busyev{background:#e7a1b3} .cal .ev.freeev{background:#9fd8b9} }
  .cal .avmark{font-size:9.5px; font-weight:800; border-radius:5px; padding:1px 4px; margin-top:3px; align-self:flex-start}
  .cal .avmark.no{background:#fdecef; color:#c23b5e}
  .cal .avmark.ok{background:#e4f6ec; color:#2e9b6a}
  .daychips{display:flex; gap:4px; flex-wrap:wrap}

<script>
/* ============================= DATES ============================= */
// Calendar dates are kept as 'YYYY-MM-DD' in local time, so a day never
// slides across midnight the way an ISO timestamp would.
const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parseYmd = k => { const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const fmtDate = k => k ? parseYmd(k).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}) : 'TBD';
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

/* ============================= DATA ============================= */
const DEPTS = [
  { name:'Math', emoji:'📐', color:'#7aa7f0', courses:['Algebra I','Geometry','Algebra II','Precalculus','AP Precalculus','AP Calculus'] },
  { name:'Science', emoji:'🔬', color:'#63c39a', courses:['Biology','Chemistry','Honors Chemistry','Physics','AP Physics','AP Biology'] },
  { name:'Social Studies', emoji:'🌍', color:'#f0a868', courses:['AP Human Geography','World History','US History','AP US History','American Government'] },
  { name:'English', emoji:'📖', color:'#f28fb4', courses:['English 9','English 10','English 11','AP English Lang'] },
  { name:'World Languages', emoji:'🗣️', color:'#a78be6', courses:['Spanish 1','Spanish 2','Spanish 3','Spanish 4','AP Spanish','French 2'] },
  { name:'Business & Technology', emoji:'💻', color:'#5bbfd6', courses:['Computer Science Principles (CSP)','Financial Accounting'] },
];
const ALL_COURSES = DEPTS.flatMap(d => d.courses);
const courseColor = c => (DEPTS.find(d => d.courses.includes(c))?.color) || '#7aa7f0';
const courseEmoji = c => (DEPTS.find(d => d.courses.includes(c))?.emoji) || '📚';
const gradeClass = g => g?.startsWith('A') ? 'g-A' : g?.startsWith('B') ? 'g-B' : 'g-C';

// Tutors come from the sl_tutors view: alias, grade, bio and the classes they
// tutor — never a real name. Grouped per tutor after loading.
const adminIds = () => new Set((S.people||[]).filter(p=>p.role==='admin').map(p=>p.user_id));
const tutorsFor = course => (S.tutors || []).filter(t => t.courses.some(c => c.course === course) && !adminIds().has(t.id));
// Requests an administrator should look at: waiting on somebody.
const adminOpenRequests = () => (S.allRequests||[]).filter(r => r.status==='pending' || r.status==='offered');
const findTutor = id => (S.tutors || []).find(t => t.id === id);
const TUTOR_COLORS = ['#f28fb4','#7aa7f0','#a78be6','#63c39a','#f0a868','#e0679a','#4d7fd6'];
const hashStr = str => Array.from(str || '').reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) >>> 0, 7);


/* ============================= STATE ============================= */
const LS='studylink-v1';
let S = {
  tab:'home', overlay:null,
  // name is filled from the signed-in profile's alias — the app never holds a
  // real name, so there is nothing to leak into a request or a post.
  me:{ name:'You', grade:11, isTutor:false, tutorCourses:[], avail:'' },
  myRequests:[],            // requests I sent to tutors (as student)
  incoming:[],              // requests sent to me (as tutor)
  hours:0, helped:0,        // service hours, from completed sessions
  posts:[],                 // every class-board post (replies have parent_id)
  materials:[],             // shared links and notes, per class
  taken:[],                 // classes I've taken (grade claims), from setup
  roster:[],                // who is taking which class (aliases), minus me
  tutors:[],                // everyone offering tutoring, grouped per tutor
  mode:'tutee',             // which side of the sidebar is showing: 'tutee' or 'tutor'
  myClasses:[],             // classes I'm taking (Tutee side); they fill the sidebar
  tutorClasses:[],          // classes I can tutor (Tutor side)
  events:[],                // my calendar: tests, homework, study time
  classesOpen:true,         // Classes group expanded in the sidebar
  cal:null,                 // { y, m, sel } — the month on screen
};
// Only preferences live on the device now; everything else is on the server.
const PREFS = ['mode','classesOpen'];
function load(){ try{ const s=JSON.parse(localStorage.getItem(LS)); if(s) PREFS.forEach(k=>{ if(k in s) S[k]=s[k]; }); }catch(e){} }
function save(){ const o={}; PREFS.forEach(k=>o[k]=S[k]); localStorage.setItem(LS, JSON.stringify(o)); }
const uid = () => 'x'+Math.random().toString(36).slice(2,8);

/* ============================= HELPERS ============================= */
const $ = id => document.getElementById(id);
const esc = s => (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const initials = n => (n||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }
function go(tab){ S.tab=tab; S.overlay=null; S.confirmReset=false; toggleSide(false); S._top=true; render(); }
function openClass(course){ S.tab='classes'; S.overlay={type:'course',course}; toggleSide(false); S._top=true; render(); }
// First tap opens Classes; tapping it again while there folds the list.
function navClasses(){ if(S.tab==='classes' && !S.overlay) S.classesOpen=!S.classesOpen; else S.classesOpen=true; go('classes'); }
// Tutor and Tutee share the same tabs; each keeps its own list of classes.
const classKey = () => S.mode==='tutor' ? 'tutorClasses' : 'myClasses';
// The sidebar side also picks which alias you act as: tutor posts and
// replies go out under the tutor alias, everything else under the student one.
function setMode(m){ S.mode=m; S.overlay=null; A.role = (m==='tutor' && A.profile && A.profile.tutor_alias) ? 'tutor' : 'student'; S.me.name=currentAlias(); render(); }
function toggleMenu(v){ menuOpen = v===undefined ? !menuOpen : v; renderNav(); }
function menuGo(tab){ menuOpen=false; go(tab); }
function logOut(){ menuOpen=false; signOut(); }
function toggleSide(v){ $('app').classList.toggle('open', v); }
// Not 'open' or 'close': inside an inline onclick those names resolve to
// document.open and document.close, and document.open blanks the page.
function openView(ov){ S.overlay=ov; S._top=true; render(); }
function closeView(){ S.overlay=null; S._top=true; render(); }
// Top-level posts for a class, each with its replies, oldest reply first.
function postsFor(course){
  const all = S.posts || [], me = A.user ? A.user.id : null;
  return all.filter(p => p.course===course && !p.parent_id).map(p => ({
    id:p.id, who:p.author_alias, txt:p.body, mine:p.author_id===me, urgent:!!p.urgent,
    replies: all.filter(r => r.parent_id===p.id).sort((a,b)=>a.created_at.localeCompare(b.created_at)).map(r => ({ who:r.author_alias, txt:r.body })),
  }));
}
// Accepted requests, seen from my side of them.
function sessionsList(){
  const me = A.user ? A.user.id : null;
  return [...S.myRequests, ...S.incoming].filter(r => r.status==='accepted').map(r => ({
    id:r.id, course:r.course, date:r.date, day:fmtDate(r.date), time:r.time||'TBD', format:r.format,
    with: r.tutor_id===me ? r.student_alias : r.tutor_alias, role: r.tutor_id===me ? 'tutor' : 'student', status:'upcoming', location:r.location||'',
  }));
}

/* ============================= RENDER ============================= */
// Re-drawing must not move the page. Only navigation (go, openView, closeView,
// a new setup step) asks for the top, by setting S._top before render.
function render(){
  const y = window.scrollY;
  try { renderInner(); }
  catch(e){
    // A rendering bug must never leave an empty screen.
    console.error(e);
    const c = document.getElementById('scroll');
    if(c) c.innerHTML = '<div class="card" style="margin:24px auto;max-width:520px;text-align:center"><div style="font-size:34px">😵</div><div style="font-weight:800;margin:6px 0">Something went wrong on this screen</div><div class="tiny" style="margin-bottom:12px">' + esc(String(e && e.message || e)) + '</div><div class="row" style="gap:8px;justify-content:center"><button class="btn sm gray" onclick="S.overlay=null;S.tab=\'home\';render()">Go home</button><button class="btn sm" onclick="location.reload()">Reload</button></div></div>';
  }
  if(S._top){ S._top = false; window.scrollTo(0,0); }
  else { window.scrollTo(0, y); requestAnimationFrame(function(){ window.scrollTo(0, y); }); }
}
function renderInner(){
  // Nothing in the app renders until you're signed in. Names, grades and
  // requests all belong to somebody, so there's no sensible signed-out view.
  // Sign-in is parked for now (SKIP_LOGIN) — everyone lands on a demo profile.
  if(!A.profile && SKIP_LOGIN) useDemoProfile();
  document.getElementById('app').classList.toggle('auth', !A.profile);
  if(!A.profile){
    document.getElementById('head').innerHTML = '';
    document.getElementById('nav').innerHTML  = '';
    renderAuth();
    return;
  }
  if(!dataLoaded){
    if(!dataLoading && !dataError){ dataLoading = true; loadData().then(function(){ dataLoading=false; render(); }).catch(function(e){ dataLoading=false; dataError = e.message || 'Could not load your data'; render(); }); }
    document.getElementById('head').innerHTML = '';
    document.getElementById('nav').innerHTML  = '';
    document.getElementById('scroll').innerHTML = dataError
      ? '<div class="card" style="margin:60px auto;max-width:480px;text-align:center"><div style="font-size:34px">📡</div><div style="font-weight:800;margin:6px 0">Could not load your SilverCircle</div><div class="tiny" style="margin-bottom:12px">' + esc(dataError) + '</div><div class="row" style="gap:8px;justify-content:center"><button class="btn sm" onclick="dataError=null;render()">Try again</button><button class="btn sm gray" onclick="logOut()">Log out</button></div></div>'
      : '<div class="empty" style="padding-top:80px"><div class="em">📚</div>Loading your SilverCircle…</div>';
    return;
  }
  if((!A.profile.onboarded_at || S.setupForce) && !isAdmin()){
    document.getElementById('app').classList.add('auth');
    document.getElementById('head').innerHTML = ''; document.getElementById('nav').innerHTML = '';
    renderSetup(document.getElementById('scroll'));
    return;
  }
  renderHead(); renderBody(); renderNav(); save();
}

let menuOpen = false;
const TAB_TITLES = { settings:'Settings', help:'Help', home:'Home Screen', classes:'Classes', calendar:'Calendar', tutoring:'Tutoring', community:'Community', profile:'Profile', 'admin-grades':'Grade checks', 'admin-requests':'All requests', 'admin-team':'Members', admin:'Administration' };
const isStaff = () => !!(A.profile && (A.profile.role==='admin' || A.profile.role==='board'));
const hasGrade = () => !!(A.profile && A.profile.role==='student');   // staff accounts carry no grade
// Administrators run the program; they are neither tutors nor tutees. No
// survey, no tutor/tutee switch, and their work sits on the tabs. The board

const isAdmin = () => !!(A.profile && A.profile.role==='admin');
const roleBadge = r => r==='admin' ? '<span class="rolebadge admin">Administrator</span>' : r==='board' ? '<span class="rolebadge board">Board</span>' : '';

}

function incomingCount(){

}

// The sidebar: Home Screen, your Classes (a group, like boards in ETS), Calendar.
function renderNav(){
  const ov = S.overlay;
  const item = (id, ic, label, extra='') =>
    `<button class="nitem ${S.tab===id && !ov ? 'on' : ''}" onclick="go('${id}')"><span class="ic">${ic}</span>${label}${extra}</button>`;
  const inc = incomingCount();
  $('nav').innerHTML = `

      <button class="x" onclick="toggleSide(false)" aria-label="Close navigation">✕</button>
      ${menuOpen ? `<div class="menuscrim" onclick="toggleMenu(false)"></div>
      <div class="menu-pop">
        <button class="nitem" onclick="menuGo('profile')"><span class="ic">👤</span>Account</button>
        <button class="nitem" onclick="menuGo('settings')"><span class="ic">⚙️</span>Settings</button>
        <button class="nitem" onclick="menuGo('help')"><span class="ic">❓</span>Help</button>
        <hr>
        <button class="nitem" style="color:#d9534f" onclick="logOut()"><span class="ic">🚪</span>Log out</button>
      </div>` : ''}
    </div>
    ${isAdmin() ? `<nav>
      ${item('home','🏠','Home Screen')}
      <hr>
      ${item('admin-grades','✅','Grade checks', S.pendingGrades ? `<span class="count">${S.pendingGrades}</span>` : '')}
      ${item('admin-requests','📋','Requests', adminOpenRequests().length ? `<span class="count">${adminOpenRequests().length}</span>` : '')}
      ${item('admin-team','🛡️','Members')}
      <hr>

// When I'm actually free on a day, between 7 AM and 8 PM: inside any
// "available" windows I set, minus busy times and class periods.
function freeWindows(userId, k){
  const blocks=blocksOn(userId, k);
  const avail=blocks.filter(b=>b.kind==='available');
  let free = avail.length ? avail.map(b=>[Math.max(b.start_min,420), Math.min(b.end_min,1200)]) : [[420,1200]];
  const cut=[...blocks.filter(b=>b.kind==='unavailable'), ...classesOn(userId, k)];
  cut.forEach(b=>{ free = free.flatMap(([a,z])=> b.end_min<=a || b.start_min>=z ? [[a,z]] : [[a,b.start_min],[b.end_min,z]]); });
  return free.filter(([a,z])=>z-a>=15).sort((x,y)=>x[0]-y[0]);
}
// "7–8a", "10:40a–8p": short enough to fit a small square.
function tinyRange(a,b){
  const t = m => { const h=Math.floor(m/60)%24, mm=m%60; return ((h+11)%12+1)+(mm?':'+String(mm).padStart(2,'0'):''); };
  const ap = m => Math.floor(m/60)%24<12 ? 'a' : 'p';
  return ap(a)===ap(b) ? t(a)+'–'+t(b)+ap(b) : t(a)+ap(a)+'–'+t(b)+ap(b);
}
// Today to Saturday, one small square per day.
function weekFreeHtml(){
  const now=new Date(), rows=[];
  for(let i=0; i<=6-now.getDay(); i++){
    const k=ymd(addDays(now,i)), nowMin=Math.ceil((now.getHours()*60+now.getMinutes())/15)*15;
    const w=freeWindows(A.user.id, k).map(([a,z])=> i===0 ? [Math.max(a,nowMin),z] : [a,z]).filter(([a,z])=>z-a>=15);
    rows.push(`<button class="freesq ${w.length?'':'none'} ${i===0?'today':''}" title="${esc(fmtDate(k))}" onclick="S.cal={y:${addDays(now,i).getFullYear()},m:${addDays(now,i).getMonth()},sel:'${k}'}; go('calendar')">
      <span class="d">${i===0?'Today':esc(parseYmd(k).toLocaleDateString(undefined,{weekday:'short'}))}</span>
      ${w.length ? w.map(([a,z])=>`<span class="t">${esc(tinyRange(a,z))}</span>`).join('') : '<span class="t">—</span>'}
    </button>`);
  }
  return `<div class="freesqs">${rows.join('')}</div>`;
}
// "Away this week": one-time all-day unavailable blocks from today to Saturday.
function awayBlocks(){
  const today=ymd(new Date()), end=ymd(addDays(new Date(), 6-new Date().getDay()));
  return (S.availability||[]).filter(b=>b.user_id===A.user.id && !b.recurring && b.kind==='unavailable' && b.note==='Away this week' && b.date>=today && b.date<=end);
}
function toggleAwayWeek(){
  const have=awayBlocks();
  if(have.length){
    sbFetch('/rest/v1/sl_availability?id=in.('+have.map(b=>b.id).join(',')+')', { method:'DELETE', headers:{ Prefer:'return=minimal' } })
      .then(loadData).then(function(){ toast('You\'re available again'); render(); }).catch(function(e){ toast(e.message); });
    return;
  }
  const rows=[]; const d0=new Date(); const n=6-d0.getDay();
  for(let i=0;i<=n;i++) rows.push({ user_id:A.user.id, kind:'unavailable', recurring:false, date:ymd(addDays(d0,i)), start_min:0, end_min:1440, note:'Away this week' });
  sbFetch('/rest/v1/sl_availability', { method:'POST', headers:{ Prefer:'return=minimal' }, body:JSON.stringify(rows) })
    .then(loadData).then(function(){ toast('Marked away through Saturday'); render(); }).catch(function(e){ toast(e.message); });
}

// Everything on one day, in time order: all-day busy first, then timed things
// (events, sessions, busy or free times), then events with no time.
const shortTime = m => minLabel(m).replace(':00 ',' ');
function timeRange(a,b){
  const A=shortTime(a), B=shortTime(b);
  return A.slice(-2)===B.slice(-2) ? A.slice(0,-3)+'–'+B : A+'–'+B;
}
function dayEntries(k){
  const out=[];
  calItems().filter(e=>e.date===k).forEach(e=>{
    const m=slotMin(e.time);
    out.push({ min: m===null ? 2000 : m, text:(m===null ? '' : shortTime(m)+' ')+(e.kind==='session' ? e.title.replace(/^(Tutoring|Session with) /,'🤝 ') : e.title), kind:e.kind, color:courseColor(e.course) });
  });
  if(A.user) blocksOn(A.user.id, k).forEach(b=>{
    const all=b.start_min===0 && b.end_min===1440;
    const word=b.kind==='available' ? 'Free' : (b.note && b.note!=='Away this week' ? b.note : 'Busy');
    out.push({ min: all ? -1 : b.start_min, text: word+' '+(all ? 'all day' : timeRange(b.start_min, b.end_min)), kind: b.kind==='available' ? 'free' : 'busy' });
  });
  return out.sort((a,b)=>a.min-b.min);
}

// Sunday to Saturday of the current week, with sessions, requests and events on
// each day. Tapping a day opens the calendar there.
function weekStrip(){
  const now=new Date(), today=ymd(now);
  const start=addDays(now, -now.getDay());
  const items=calItems();
  let cells='';
  for(let i=0;i<7;i++){
    const d=addDays(start,i), k=ymd(d);
    const evs=dayEntries(k);
    cells += `<button class="wday ${k===today?'today':''} ${k<today?'past':''}" onclick="S.cal={y:${d.getFullYear()},m:${d.getMonth()},sel:'${k}'}; go('calendar')" title="${esc(fmtDate(k))}">
      <span class="dn">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][i]}</span>
      <span class="dd">${d.getDate()}</span>
      ${evs.slice(0,4).map(e=>`<span class="wi ${e.kind==='session'?'sess':e.kind==='pending'?'pend':e.kind==='busy'?'busy':e.kind==='free'?'free':''}" style="--c:${e.color||'transparent'}">${esc(e.text)}</span>`).join('')}
      ${evs.length>4?`<span class="more">+${evs.length-4} more</span>`:''}
    </button>`;
  }
  return `<div class="week">${cells}</div>`;
}

// One column of the home screen: the sessions where I'm the student, or the
// ones where I'm the tutor. Upcoming first; the tutor side can mark a session
// done once its day has come.
function sessionColumn(role){
  const me=A.user ? A.user.id : null, today=ymd(new Date());
  const rows=(role==='tutor' ? S.incoming : S.myRequests)
    .filter(r=>r.status==='accepted' || (role==='student' && (r.status==='pending' || r.status==='offered')) || (role==='tutor' && r.status==='offered'))
    .sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999') || (a.time||'').localeCompare(b.time||''));
  if(!rows.length){
    return role==='tutor'
      ? `<div class="tiny" style="text-align:center;padding:10px">${S.me.isTutor ? 'Nobody booked yet. Requests to you land in Tutoring.' : 'You aren\'t tutoring yet.'}</div>
         ${S.me.isTutor ? '' : `<button class="btn ghost sm" style="width:100%;margin-top:6px" onclick="openView({type:'becomeTutor'})">✋ Become a tutor</button>`}`
      : `<div class="tiny" style="text-align:center;padding:10px">No sessions booked. Open a class to find a tutor.</div>
         <button class="btn ghost sm" style="width:100%;margin-top:6px" onclick="go('classes')">Find a tutor</button>`;
  }
  const done = S.incoming.filter(r=>r.status==='done').length;
  return rows.map(r=>{
    const other = role==='tutor' ? r.student_alias : r.tutor_alias;
    const dayLabel = r.date ? (r.date===today ? 'Today' : parseYmd(r.date).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})) : 'Day TBD';
    const pending = r.status==='pending' || r.status==='offered';
    const tag = r.status==='offered' ? (role==='student' ? 'Offer · see Tutoring' : 'Offered') : 'Waiting';
    const seen = S.presence ? S.presence[r.id] : null;
    return `<div class="sessrow">
      ${avatarDot(courseEmoji(r.course), seen, 'width:38px;height:38px;font-size:15px;background:'+courseColor(r.course))}
      <div style="min-width:0;flex:1">
        <div class="who">${esc(other)} <span class="tiny">· ${esc(r.course)}</span> ${seenHtml(seen)}</div>
        <div class="meta">${esc(r.topic||'')}${r.topic?' · ':''}${esc(r.time||'Time TBD')} · ${esc(r.format)}${r.location?' · 📍 '+esc(r.location):''}</div>
      </div>
      ${pending ? `<span class="pill" style="background:#fbf1e2;color:#c98b34;cursor:pointer" onclick="go('tutoring')">${tag}</span>` : `<span class="when">${esc(dayLabel)}</span>`}
      ${role==='tutor' && !pending && r.date && r.date<=today ? `<button class="btn sm green" onclick="completeSession('${r.id}')">Done</button>` : ''}
      ${r.status==='accepted' ? cancelBtn(r.id,'session').replace('margin-left:auto;','') : role==='tutor' && r.status==='offered' ? cancelBtn(r.id,'offer').replace('margin-left:auto;','') : ''}
    </div>`;
  }).join('') + (role==='tutor' && done ? `<div class="tiny" style="text-align:center;margin-top:8px">${done} session${done===1?'':'s'} completed · ${S.hours} service hours</div>` : '');
}

function filterAdd(q){
  q=q.toLowerCase();
  document.querySelectorAll('#addlist .adddept').forEach(dep=>{
    let any=false;
    dep.querySelectorAll('.chip').forEach(ch=>{ const hit=ch.dataset.name.includes(q); ch.hidden=!hit; any=any||hit; });
    dep.hidden=!any;
  });
}
function toggleClass(course){
  const q=$('acq')?.value||'';
  const key=classKey(), had=S[key].includes(course);
  S[key] = had ? S[key].filter(x=>x!==course) : [...S[key], course];
  render();
  if(q){ $('acq').value=q; filterAdd(q); }
  saveClass(course, !had);
}
// The class lists are written straight through; a failure reloads from the server.
function saveClass(course, add){
  const me=A.user.id, tutor=S.mode==='tutor';
  const table = tutor ? 'sl_tutor_courses' : 'sl_student_classes';
  const p = add
    ? sbFetch('/rest/v1/'+table, { method:'POST', headers:{ Prefer:'return=minimal,resolution=ignore-duplicates' }, body:JSON.stringify(tutor ? { user_id:me, course, availability:S.me.avail||'' } : { user_id:me, course }) })
    : sbFetch('/rest/v1/'+table+'?user_id=eq.'+me+'&course=eq.'+encodeURIComponent(course), { method:'DELETE', headers:{ Prefer:'return=minimal' } });
  p.then(function(){ if(tutor) return loadData().then(render); }).catch(function(e){ toast(e.message); loadData().then(render); });
}
function removeClass(course){
  S[classKey()]=S[classKey()].filter(x=>x!==course);
  render(); toast('Removed '+course);
  saveClass(course, false);
}

/* -------- CALENDAR -------- */
const EVENT_KINDS = { test:'📝 Test', homework:'📚 Homework', study:'📖 Study', other:'📌 Other', session:'🤝 Tutoring', pending:'⏳ Waiting for an answer', offer:'📨 Offer · answer in Tutoring' };
// Everything with a date: my own events, booked sessions, and requests still waiting.
function calItems(){
  // Administrators see every confirmed session in the school, not just their own.
  if(isAdmin()) return [
    ...S.events,
    ...(S.allRequests||[]).filter(r=>r.date && r.status==='accepted').map(r=>({ id:r.id, date:r.date, time:r.time, course:r.course, kind:'session', title:(r.student_alias||'Student')+' with '+(r.tutor_alias||'Tutor'), color:courseColor(r.course) })),
  ];
  return [
    ...S.events,
    ...sessionsList().filter(x=>x.date).map(x=>({ id:x.id, date:x.date, time:x.time, course:x.course, kind:'session', title:(x.role==='tutor'?'Tutoring ':'Session with ')+x.with, cancel:'session' })),
    ...S.myRequests.filter(r=>r.date && r.status==='pending').map(r=>({ id:r.id, date:r.date, time:r.time, course:r.course, kind:'pending', title:'Waiting on '+r.tutor_alias, cancel:'request' })),
    ...S.incoming.filter(r=>r.date && r.status==='offered').map(r=>({ id:r.id, date:r.date, time:r.time, course:r.course, kind:'pending', title:'Offered to '+r.student_alias, cancel:'offer' })),
    ...S.myRequests.filter(r=>r.date && r.status==='offered').map(r=>({ id:r.id, date:r.date, time:r.time, course:r.course, kind:'offer', title:r.tutor_alias+' wants to meet', fixed:true })),
  ];
}
const byWhen = (a,b) => a.date.localeCompare(b.date) || (a.time||'').localeCompare(b.time||'');
function eventRow(e){
  return `<div class="evrow" style="--c:${courseColor(e.course)}">
    <div class="bar"></div>
    <div style="min-width:0">
      <div style="font-weight:800;font-size:14px">${esc(e.title)}</div>
      <div class="tiny">${esc(fmtDate(e.date))}${e.time?' · '+esc(e.time):''} · ${EVENT_KINDS[e.kind]||''}${e.course?' · '+esc(e.course):''}</div>
    </div>
    ${e.cancel ? cancelBtn(e.id, e.cancel) : e.fixed ? '' : `<button class="del" title="Delete" onclick="deleteEvent('${e.id}')">✕</button>`}
  </div>`;
}
function renderCalendar(c){
  const now=new Date();
  S.cal = S.cal || { y:now.getFullYear(), m:now.getMonth(), sel:ymd(now) };
  const { y, m, sel } = S.cal;
  const first = new Date(y, m, 1);
  const start = addDays(first, -first.getDay());
  const items = calItems();
  const today = ymd(now);
  let cells='';
  for(let i=0;i<42;i++){
    const d=addDays(start,i), k=ymd(d);
    if(i>=35 && d.getMonth()!==m) break;   // drop a sixth row that is all next month
    const evs=items.filter(e=>e.date===k).sort(byWhen);
    const myBlocks=blocksOn(A.user.id, k);
    const allBusy=myBlocks.some(b=>b.kind==='unavailable' && b.start_min===0 && b.end_min===1440);
    const anyBusy=myBlocks.some(b=>b.kind==='unavailable'), anyFree=myBlocks.some(b=>b.kind==='available');
    cells += `<div class="day ${d.getMonth()!==m?'out':''} ${k===today?'today':''} ${k===S.cal.open?'sel':''} ${allBusy?'busy':anyFree&&!anyBusy?'free':''}" role="button" tabindex="0" onclick="openDay('${k}')" onkeydown="if(event.key==='Enter')openDay('${k}')">
      <span class="n">${d.getDate()}</span>
      <button class="plus" title="Add to ${esc(fmtDate(k))}" aria-label="Add to ${esc(fmtDate(k))}" onclick="event.stopPropagation(); openDay('${k}')">+</button>
      ${dayEntries(k).slice(0,3).map(e=>`<div class="ev ${e.kind==='busy'?'busyev':e.kind==='free'?'freeev':''}" style="--c:${e.color||'transparent'}">${esc(e.text)}</div>`).join('')}
      ${dayEntries(k).length>3?`<div class="more">+${dayEntries(k).length-3} more</div>`:''}
    </div>`;
  }
  c.innerHTML = `
    <div class="calhead">
      <h3>${MONTHS[m]} ${y}</h3>
      <button onclick="calMove(-1)" aria-label="Previous month">‹</button>
      <button onclick="S.cal={y:${now.getFullYear()},m:${now.getMonth()},sel:'${today}'}; render()">Today</button>
      <button onclick="calMove(1)" aria-label="Next month">›</button>
    </div>
    <div class="cal">
      ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="dow">${d}</div>`).join('')}
      ${cells}
    </div>

    ${S.cal.open ? dayModalHtml(S.cal.open) : ''}
  `;
}
// One day, opened from its square: what's on it, and tabs to add more.

      <button class="btn" onclick="addEvent()">Add to calendar</button>

  } else if(t==='avail'){

  } else {

      <div style="font-size:30px">🤝</div>
      <div class="tiny" style="margin:6px 0 12px">Pick a student, a time and a place. They get it in Tutoring, and once they accept it's on both calendars.</div>
      <button class="btn" onclick="S.cal.open=null; openView({type:'schedule', date:'${k}'})">Schedule tutoring on ${esc(fmtDate(k))}</button>
    </div>`;
  }
  return `<div class="dm-back" onclick="if(event.target===this)closeDay()">
    <div class="dm" role="dialog" aria-label="${esc(fmtDate(k))}">

function availFormHtml(sel){

    ${f.recurring ? `<div class="field"><label>On</label><div class="daychips">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map((d,i)=>`<button class="${f.weekdays.includes(i)?'on':''}" onclick="toggleAvailDay(${i})">${d}</button>`).join('')}</div></div>` : ''}

      <div class="seg"><button class="${f.allDay?'on':''}" onclick="S.availForm.allDay=true;render()">All day</button><button class="${!f.allDay?'on':''}" onclick="S.availForm.allDay=false;render()">Between</button></div></div>
    ${!f.allDay ? `<div class="row" style="gap:10px">
      <div class="field" style="flex:1"><label>From</label><select onchange="S.availForm.start=this.value">${slots.map(x=>`<option ${f.start===x?'selected':''}>${x}</option>`).join('')}</select></div>
      <div class="field" style="flex:1"><label>To</label><select onchange="S.availForm.end=this.value">${slots.map(x=>`<option ${f.end===x?'selected':''}>${x}</option>`).join('')}</select></div>
    </div>` : ''}
    <div class="field"><label>Note (optional)</label><input value="${esc(f.note)}" placeholder="e.g. Robotics practice" oninput="S.availForm.note=this.value"></div>
    <button class="btn" onclick="addAvail('${sel}')">Save</button>`;

function toggleAvailDay(i){ const a=S.availForm.weekdays, k=a.indexOf(i); if(k<0) a.push(i); else a.splice(k,1); render(); }
function addAvail(sel){
  const f=S.availForm, me=A.user.id;
  const start = f.allDay ? 0 : slotMin(f.start), end = f.allDay ? 1440 : slotMin(f.end);
  if(!f.allDay && (start===null || end===null || end<=start)){ toast('The end time needs to be after the start.'); return; }
  if(f.recurring && !f.weekdays.length){ toast('Pick at least one day of the week.'); return; }
  const rows = f.recurring
    ? f.weekdays.map(wd=>({ user_id:me, kind:f.kind, recurring:true, weekday:wd, start_min:start, end_min:end, note:f.note.trim() }))
    : [{ user_id:me, kind:f.kind, recurring:false, date:sel, start_min:start, end_min:end, note:f.note.trim() }];
  sbFetch('/rest/v1/sl_availability', { method:'POST', headers:{ Prefer:'return=minimal' }, body:JSON.stringify(rows) })
    .then(loadData).then(function(){ S.availForm.note=''; if(S.cal) S.cal.tab='see'; toast('Saved'); render(); }).catch(function(e){ toast(e.message); });
}
function deleteAvail(id){
  S.availability = S.availability.filter(b=>b.id!==id); render();
  sbFetch('/rest/v1/sl_availability?id=eq.'+id, { method:'DELETE', headers:{ Prefer:'return=minimal' } }).catch(function(e){ toast(e.message); loadData().then(render); });
}
function calMove(n){
  let { y, m } = S.cal; m+=n;
  if(m<0){ m=11; y--; } if(m>11){ m=0; y++; }
  S.cal = { y, m, sel: ymd(new Date(y,m,1)) };
  render();
}
function addEvent(){
  const title=$('ev_title').value.trim();
  if(!title){ $('ev_title').focus(); return; }
  const t=$('ev_time').value;
  const time = t ? new Date('2000-01-01T'+t).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}) : '';
  const ev={ id:uid(), user_id:A.user.id, date:S.cal.sel, time, title, kind:$('ev_kind').value, course:$('ev_course').value };
  S.events.push(ev);
  S.cal.tab='see'; render(); toast('Added to '+fmtDate(S.cal.sel));
  sbFetch('/rest/v1/sl_events', { method:'POST', body:JSON.stringify({ user_id:ev.user_id, date:ev.date, time, title, kind:ev.kind, course:ev.course }) })
    .then(function(rows){ if(rows && rows[0]) ev.id = rows[0].id; })
    .catch(function(e){ toast(e.message); loadData().then(render); });
}
function deleteEvent(id){
  S.events=S.events.filter(e=>e.id!==id);
  render();
  sbFetch('/rest/v1/sl_events?id=eq.'+id, { method:'DELETE', headers:{ Prefer:'return=minimal' } }).catch(function(e){ toast(e.message); loadData().then(render); });
}

// Tutee side: the tutors for this class, with the grade and format filters.
function tutorsHtml(course){
  let tutors = tutorsFor(course);
  const f = S.overlay.filter || {};
  if(f.grade) tutors = tutors.filter(t=>{ const g=(t.courses.find(x=>x.course===course)||{}).grade||''; return f.grade==='A'?g.startsWith('A'):f.grade==='B'?(g.startsWith('A')||g.startsWith('B')):true; });
  if(f.format) tutors = tutors.filter(t=>t.format.toLowerCase().includes(f.format));
  if(f.day && f.time) tutors = tutors.filter(t=>freeAt(t.id, f.day, f.time).free);
  const active = (f.grade?1:0) + (f.format?1:0) + (f.day&&f.time?1:0);
  const openF = !!S.overlay.showFilters;
  return `
    <div class="row" style="margin-top:12px">

      <button class="btn ghost sm" style="margin-left:auto" onclick="S.overlay.showFilters=!S.overlay.showFilters;render()">⚙ Filter${active?' · '+active:''} ${openF?'▴':'▾'}</button>
    </div>
    ${openF ? `<div class="card" style="margin-top:8px;padding:10px 12px">
      <div class="tiny" style="margin-bottom:6px">Grade earned</div>
      <div class="chips">${[['','Any'],['B','B or higher'],['A','A only']].map(([v,l])=>`<button class="chip ${(!f.grade&&!v)||f.grade===v?'dept':''}" style="${(!f.grade&&!v)||f.grade===v?'background:'+courseColor(course):''}" onclick="setFilter('grade','${v}')">${l}</button>`).join('')}</div>
      <div class="tiny" style="margin:10px 0 6px">Format</div>
      <div class="chips">${[['','Any'],['virtual','Virtual'],['person','In person']].map(([v,l])=>`<button class="chip ${(!f.format&&!v)||f.format===v?'dept':''}" style="${(!f.format&&!v)||f.format===v?'background:'+courseColor(course):''}" onclick="setFilter('format','${v}')">${l}</button>`).join('')}</div>
      <div class="tiny" style="margin:10px 0 6px">Free at a certain time</div>
      <div class="row" style="gap:8px;flex-wrap:wrap">
        <input type="date" value="${esc(f.day||'')}" min="${ymd(new Date())}" onchange="setFilter('day',this.value)" style="padding:8px 10px;border:1.5px solid #e5e2f0;border-radius:10px;font:inherit;font-size:13px">
        <select onchange="setFilter('time',this.value)" style="padding:8px 10px;border:1.5px solid #e5e2f0;border-radius:10px;font:inherit;font-size:13px;background:#fff"><option value="">Any time</option>${TIME_SLOTS.map(x=>`<option ${f.time===x?'selected':''}>${x}</option>`).join('')}</select>
      </div>
      ${active ? `<button class="btn ghost sm" style="margin-top:10px" onclick="S.overlay.filter={};render()">Clear filters</button>` : ''}
    </div>` : ''}

    ${tutors.length ? tutors.map(t=>tutorCard(t,course)).join('') : `<div class="empty"><div class="em">🔍</div>${tutorsFor(course).length ? 'No tutors match — try loosening the filters.' : 'No tutors for this class yet. Ask on the Community tab, or check back soon.'}</div>`}`;
}

// Tutor side: the students taking this class, and a way to offer them help.

  return `
    ${canOffer || isAdmin() ? '' : `<div class="card tiny" style="margin-top:10px">To offer help here, add ${esc(course)} to the classes you tutor first.${S.me.isTutor ? '' : ' <button class="btn ghost sm" style="margin-left:6px" onclick="openView({type:\'becomeTutor\'})">Become a tutor</button>'}</div>`}

      <div style="min-width:0;flex:1"><div style="font-weight:800">${esc(st.student_alias)} ${seenHtml(st.last_seen_at)}</div><div class="tiny">${st.grade_level?'Grade '+st.grade_level:''}${r ? (st.grade_level?' · ':'') + (r.status==='offered' ? 'You offered to help' : r.status==='pending' ? 'They asked you for help' : 'Session booked') : ''}</div></div>
      ${r ? `<span class="pill" style="margin-left:auto;${r.status==='accepted'?'background:#e4f6ec;color:#2e9b6a':''}">${r.status==='offered'?'Offered':r.status==='pending'?'Requested':'Confirmed'}</span>`
          : canOffer ? `<span class="row" style="gap:6px;margin-left:auto;flex:0 0 auto"><button class="btn sm ghost" onclick="openView({type:'schedule', course:'${esc(course)}', student:'${st.user_id}'})">📅 Schedule</button><button class="btn sm" onclick="offerHelp('${st.user_id}','${esc(st.student_alias)}','${esc(course)}',this)">Offer help</button></span>` : ''}

// Many sessions: every picked weekday from the start date, for that many weeks.
const reqMany = () => document.querySelector('#rq_count button.on')?.dataset.v==='many';
function manyDates(){
  const days=[...document.querySelectorAll('#rq_wd button.dept')].map(b=>+b.dataset.d);
  const start=$('rq_start')?.value, weeks=+($('rq_weeks')?.value||0);
  if(!start || !days.length) return [];
  const out=[], first=parseYmd(start), end=addDays(first, weeks*7);
  for(let d=first; d<end; d=addDays(d,1)) if(days.includes(d.getDay())) out.push(ymd(d));
  return out;
}
// Is the tutor free at the day and time picked? Blocks Send when not.
// Both people have to be out of class and not busy.
const bothFree = (otherId, day, time) => freeAt(otherId, day, time).free && freeAt(A.user.id, day, time).free;
function checkFree(tid){
  const day=$('rq_day')?.value, time=$('rq_time')?.value, box=$('rq_free'), btn=$('rq_send'); if(!box) return;
  if(reqMany()){
    const dates=manyDates(), free=dates.filter(k=>bothFree(tid,k,time)), busy=dates.length-free.length;
    box.innerHTML = !dates.length ? '<span style="color:var(--muted);font-weight:700">Pick at least one day of the week.</span>'
      : !free.length ? '<span style="color:#c23b5e;font-weight:800">✕ None of those dates work at '+esc(time)+' (class or busy). Try another time.</span>'
      : '<span class="seen on">✓ '+free.length+' session'+(free.length===1?'':'s')+', '+esc(fmtDate(free[0]))+' to '+esc(fmtDate(free[free.length-1]))+'</span>'
        + (busy ? ' <span style="color:#c98b34;font-weight:700">· '+busy+' date'+(busy===1?'':'s')+' when one of you is busy or in class will be skipped</span>' : '');
    if(btn){ btn.disabled=!free.length; }
    return;
  }
  const mine=freeAt(A.user.id, day, time);
  if(!mine.free){ box.innerHTML='<span style="color:#c23b5e;font-weight:800">✕ You are '+esc(mine.why.replace(/^unavailable/,'busy'))+'. Pick another time.</span>'; if(btn) btn.disabled=true; return; }
  const r=freeAt(tid, day, time);
  box.innerHTML = r.free ? '<span class="seen on">✓ Free then</span>' : '<span style="color:#c23b5e;font-weight:800">✕ Not available: '+esc(r.why)+'. Pick another time.</span>';
  if(btn){ btn.disabled=!r.free; }
}
// ---- Availability ----
// Minutes since midnight for a slot label like "3:30 PM".
function slotMin(label){ const m=/^(\d+):(\d\d) (AM|PM)$/.exec((label||'').replace(/[\u202f\u00a0]/g,' ').trim()); if(!m) return null; let h=+m[1]%12; if(m[3]==='PM') h+=12; return h*60 + +m[2]; }
function minLabel(min){ if(min>=1440) return '12:00 AM'; const h=Math.floor(min/60), mm=min%60, h12=((h+11)%12)+1; return h12+':'+(mm<10?'0':'')+mm+' '+(h<12?'AM':'PM'); }
const DAY_NAMES=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
// The blocks that apply to one date, for one person.
// Class periods are stored as weekly 'unavailable' blocks whose note starts
// with CLASS_NOTE. They block tutoring like any busy time, but they belong to
// the class schedule, not the calendar, so blocksOn leaves them out.
const CLASS_NOTE = 'Class · ';
const isClassBlock = b => b.kind==='unavailable' && (b.note||'').startsWith(CLASS_NOTE);
function blocksOn(userId, dateKey){
  const wd=parseYmd(dateKey).getDay();
  return (S.availability||[]).filter(b => b.user_id===userId && !isClassBlock(b) && (b.recurring ? b.weekday===wd : b.date===dateKey));
}
function classesOn(userId, dateKey){
  const wd=parseYmd(dateKey).getDay();
  return (S.availability||[]).filter(b => b.user_id===userId && isClassBlock(b) && b.recurring && b.weekday===wd);
}
// My class periods, one per period (they repeat Monday to Friday).
function mySchedule(){
  const seen={}, out=[];
  (S.availability||[]).filter(b=>A.user && b.user_id===A.user.id && isClassBlock(b)).forEach(b=>{
    const key=b.start_min+'-'+b.end_min; if(seen[key]) return; seen[key]=1;
    out.push({ name:b.note.slice(CLASS_NOTE.length), start:b.start_min, end:b.end_min });
  });
  return out.sort((a,b)=>a.start-b.start);
}
// Free at a date and time? Unavailable blocks win. If the person has set any
// available blocks for that day, the time must fall inside one; with none
// set, the day is open.
function freeAt(userId, dateKey, timeLabel){
  const min=slotMin(timeLabel); if(min===null || !dateKey) return { free:true };
  const blocks=blocksOn(userId, dateKey);
  const hit = b => min>=b.start_min && min<b.end_min;
  const cls=classesOn(userId, dateKey).find(hit);
  if(cls) return { free:false, inClass:true, why:'in class then ('+cls.note.slice(CLASS_NOTE.length)+', '+minLabel(cls.start_min)+'–'+minLabel(cls.end_min)+')' };
  const busy=blocks.find(b=>b.kind==='unavailable' && hit(b));
  if(busy) return { free:false, why: busy.start_min===0&&busy.end_min===1440 ? 'unavailable that day' : 'unavailable '+minLabel(busy.start_min)+'–'+minLabel(busy.end_min) };
  const windows=blocks.filter(b=>b.kind==='available');
  if(windows.length && !windows.some(hit)) return { free:false, why:'only free '+windows.map(b=>b.start_min===0&&b.end_min===1440?'all day':minLabel(b.start_min)+'–'+minLabel(b.end_min)).join(', ')+' that day' };
  return { free:true };
}
function availLabel(b){
  const when = b.recurring ? 'Every '+DAY_NAMES[b.weekday] : fmtDate(b.date);
  const span = b.start_min===0 && b.end_min===1440 ? 'All day' : minLabel(b.start_min)+' – '+minLabel(b.end_min);
  return when+' · '+span;
}

// Times are picked from half-hour slots across the school day and evening.
// The default leans on the tutor's availability: mornings if they said
// before school, evenings if they said evenings, otherwise after school.
const TIME_SLOTS=(function(){ const out=[]; for(let m=7*60; m<=20*60; m+=30){ const h=Math.floor(m/60), mm=m%60; const h12=((h+11)%12)+1; out.push(h12+':'+(mm?'30':'00')+' '+(h<12?'AM':'PM')); } return out; })();
function suggestTime(t){
  const a=(t && t.avail)||'';
  if(/After school/.test(a)) return '3:30 PM';
  if(/Before school/.test(a)) return '7:30 AM';
  if(/Evenings/.test(a)) return '6:00 PM';
  return '3:30 PM';
}
// Where to meet, depending on the format. Classroom and Other take a detail.
const PLACES = { 'In person':['Library','Learning commons','Cafeteria','Classroom','Front office / counseling','Other'], 'Virtual':['Google Meet','Zoom','FaceTime','Phone call','Other'] };
function fillLocations(){
  const fmt=document.querySelector('#rq_fmt button.on')?.dataset.v||'In person', sel=$('rq_loc'); if(!sel) return;
  sel.innerHTML = PLACES[fmt].map(x=>`<option>${x}</option>`).join('');
  locDetail();
}
function locDetail(){
  const v=$('rq_loc')?.value||'', d=$('rq_locd'); if(!d) return;
  const need = v==='Classroom' || v==='Other';
  d.style.display = need ? 'block' : 'none';
  d.placeholder = v==='Classroom' ? 'Room number and teacher' : 'Say where';

async function submitRequest(tid){
  const t=findTutor(tid); if(!t) return;
  const course=$('rq_course').value;
  const topic=$('rq_topic').value.trim()||'General help';
  const note=($('rq_desc').value||'').trim();
  const date=$('rq_day').value||null;
  const time=$('rq_time').value||'TBD';
  const fmt=document.querySelector('#rq_fmt button.on')?.dataset.v||'In person';
  const many=reqMany();
  const dates = many ? manyDates().filter(k=>bothFree(tid,k,time)) : [date];
  if(many && !dates.length){ toast('Pick days the tutor is free.'); return; }
  if(!many && !bothFree(tid, date, time)){ toast('One of you is in class or busy then.'); return; }
  const locBase=$('rq_loc')?.value||'', locD=($('rq_locd')?.value||'').trim();
  const location = locBase + (locD && (locBase==='Classroom'||locBase==='Other') ? ' · '+locD : '');
  const btn=$('rq_send'); if(btn){ btn.disabled=true; btn.textContent='Sending…'; }
  try{
    // Many sessions go up as one row per date in a single insert, so they
    // share a created_at — that is how the tutor's side groups them.
    await sbFetch('/rest/v1/sl_requests', { method:'POST', headers:{ Prefer:'return=minimal' }, body:JSON.stringify(dates.map(d=>({
      student_id:A.user.id, tutor_id:tid, student_alias:A.profile.student_alias, tutor_alias:t.name,
      course, topic: many ? SERIES_TOPIC : topic, note, date:d, time, format:fmt, location }))) });
    await loadData();
    closeView(); go('tutoring');
    toast(many ? 'Asked '+t.name+' for '+dates.length+' sessions 🎉' : 'Request sent to '+t.name+' 🎉');
  }catch(e){
    toast(e.message); if(btn){ btn.disabled=false; btn.textContent='Send request to '+t.name; }
  }
}

/* -------- CLASS SCHEDULE -------- */
// Nobody can book tutoring during your classes. Study hall and lunch are
// left off the list, so those stay open.
const DEFAULT_PERIODS = [['Period 1','08:00','08:50'],['Period 2','08:55','09:45'],['Period 3','09:50','10:40'],['Period 4','10:45','11:35'],['Period 5','12:10','13:00'],['Period 6','13:05','13:55'],['Period 7','14:00','14:50']];
const hhmm = m => String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const toMin = v => { const [h,m]=(v||'').split(':').map(Number); return isNaN(h)||isNaN(m) ? null : h*60+m; };
function scheduleDraft(){
  const have=mySchedule();
  return have.length ? have.map(p=>({ name:p.name, start:hhmm(p.start), end:hhmm(p.end) }))
                     : DEFAULT_PERIODS.map(([name,start,end])=>({ name, start, end }));
}
function scheduleEditorHtml(d){
  return `<div class="card">
    <div class="tiny" style="font-size:13px;margin-bottom:10px;line-height:1.5">Add the periods you're <b>in class</b>, Monday to Friday. Nobody can book tutoring with you then.
      <b>Delete your study hall and lunch</b> (✕), since those stay open for tutoring.</div>
    ${d.map((p,i)=>`<div class="periodrow">
      <input value="${esc(p.name)}" aria-label="Period name" oninput="S.schedDraft[${i}].name=this.value">
      <input type="time" step="300" value="${p.start}" aria-label="Starts" onchange="S.schedDraft[${i}].start=this.value">
      <span class="tiny">to</span>
      <input type="time" step="300" value="${p.end}" aria-label="Ends" onchange="S.schedDraft[${i}].end=this.value">
      <button class="del" title="Remove (study hall, lunch)" onclick="S.schedDraft.splice(${i},1); render()">✕</button>
    </div>`).join('') || '<div class="tiny" style="text-align:center;padding:8px">No class periods. You can be booked any time.</div>'}
    <button class="btn ghost sm" style="width:100%;margin-top:8px" onclick="addPeriod()">＋ Add a class period</button>
  </div>`;
}
function addPeriod(){
  const d=S.schedDraft, last=d[d.length-1], start=last ? toMin(last.end)+5 : 8*60;
  d.push({ name:'Period '+(d.length+1), start:hhmm(start), end:hhmm(Math.min(start+50, 23*60)) }); render();
}
function scheduleProblem(d){
  for(const p of d){
    const a=toMin(p.start), b=toMin(p.end);
    if(!p.name.trim()) return 'Every period needs a name.';
    if(a===null || b===null || b<=a) return (p.name||'A period')+' needs to end after it starts.';
  }
  return '';
}
async function saveSchedule(d){
  const me=A.user.id;
  await sbFetch('/rest/v1/sl_availability?user_id=eq.'+me+'&kind=eq.unavailable&note=like.'+encodeURIComponent(CLASS_NOTE+'*'), { method:'DELETE', headers:{ Prefer:'return=minimal' } });
  const rows=[];
  d.forEach(p=>{ for(let wd=1; wd<=5; wd++) rows.push({ user_id:me, kind:'unavailable', recurring:true, weekday:wd, start_min:toMin(p.start), end_min:toMin(p.end), note:CLASS_NOTE+p.name.trim() }); });
  if(rows.length) await sbFetch('/rest/v1/sl_availability', { method:'POST', headers:{ Prefer:'return=minimal' }, body:JSON.stringify(rows) });
}
function renderClassSchedule(c){

/* -------- SCHEDULE A SESSION (tutor, overlay) -------- */
// A tutor picks a student, a class and a time. It goes out as an offer with
// a date; once the student accepts it, it is a booked session on both calendars.
function scheduleStudents(course){
  const by={};
  S.roster.filter(r=>r.course===course).forEach(r=>{ by[r.user_id]=r.student_alias; });
  S.incoming.filter(r=>r.course===course).forEach(r=>{ by[r.student_id]=r.student_alias; });
  return Object.entries(by).map(([id,alias])=>({id,alias})).sort((a,b)=>a.alias.localeCompare(b.alias, undefined, {numeric:true}));
}

// Warn when the tutor already has something booked at that day and time.
function checkClash(){
  const day=$('sc_day')?.value, time=$('sc_time')?.value, box=$('sc_clash'); if(!box) return;
  const sid=$('sc_student')?.value, btn=$('sc_send');
  const me=freeAt(A.user.id, day, time), them=sid ? freeAt(sid, day, time) : { free:true };
  if(btn) btn.disabled = !sid || !me.free || !them.free;
  if(!me.free){ box.innerHTML='<span style="color:#c23b5e;font-weight:800">✕ You are '+esc(me.why.replace(/^unavailable/,'busy'))+'.</span>'; return; }
  if(!them.free){ box.innerHTML='<span style="color:#c23b5e;font-weight:800">✕ '+esc($('sc_student').options[$('sc_student').selectedIndex].text)+' is '+esc(them.why.replace(/^unavailable/,'busy'))+'.</span>'; return; }
  const hit=[...S.incoming, ...S.myRequests].find(r=>r.date===day && r.time===time && ['accepted','offered','pending'].includes(r.status));
  box.innerHTML = hit ? `<span style="color:#c98b34;font-weight:800">⚠ You already have ${esc(hit.course)} with ${esc(hit.tutor_id===A.user.id ? hit.student_alias : hit.tutor_alias)} then.</span>` : '';
}
async function sendSchedule(){

  const fmt=document.querySelector('#rq_fmt button.on')?.dataset.v||'In person';
  const locBase=$('rq_loc')?.value||'', locD=($('rq_locd')?.value||'').trim();
  const location = locBase + (locD && (locBase==='Classroom'||locBase==='Other') ? ' · '+locD : '');
  const btn=$('sc_send'); btn.disabled=true; btn.textContent='Sending…';
  try{
    await sbFetch('/rest/v1/sl_requests', { method:'POST', headers:{ Prefer:'return=minimal' }, body:JSON.stringify({
      student_id:studentId, tutor_id:A.user.id, student_alias:alias, tutor_alias:A.profile.tutor_alias,
      course:$('sc_course').value, topic:$('sc_topic').value.trim()||'Tutoring session', note:($('sc_note').value||'').trim(),
      date, time:$('sc_time').value, format:fmt, location, status:'offered' }) });
    await loadData();
    closeView(); go('tutoring');

/* -------- ANOTHER TIME, AND CHAT -------- */
// Either side can suggest a new time, back and forth, until it works. A time

const findReq = id => [...S.myRequests, ...S.incoming].find(x=>x.id===id);
function otherSide(r){
  const tutor = r.tutor_id===A.user.id;
  return tutor ? { id:r.student_id, alias:r.student_alias, iAmTutor:true } : { id:r.tutor_id, alias:r.tutor_alias, iAmTutor:false };

async function sendRetime(){
  const r=findReq(S.overlay.id), o=otherSide(r), date=$('rt_day').value, time=$('rt_time').value, msg=$('rt_msg').value.trim();
  if(!bothFree(o.id, date, time)){ toast('One of you is in class or busy then.'); return; }
  const btn=$('rt_send'); btn.disabled=true; btn.textContent='Sending…';
  try{
    await sbFetch('/rest/v1/sl_requests?id=eq.'+r.id, { method:'PATCH', headers:{ Prefer:'return=minimal' }, body:JSON.stringify({ date, time, status: o.iAmTutor ? 'offered' : 'pending' }) });
    // Leave a line in the chat so the other person sees why the time moved.
    sendMessage(r.id, '🕒 Suggested '+fmtDate(date)+' at '+time+(msg ? ' — '+msg : '')).catch(()=>{});
    await loadData(); closeView(); go('tutoring');
    toast('New time sent to '+o.alias+' — waiting on them');
  }catch(e){ toast(e.message); btn.disabled=false; btn.textContent='Send to '+o.alias; }

let chatTimer=null;
function sendMessage(requestId, body){
  return sbFetch('/rest/v1/sl_messages', { method:'POST', headers:{ Prefer:'return=minimal' }, body:JSON.stringify({ request_id:requestId, sender_id:A.user.id, body }) });
}
async function loadChat(id){
  try{
    const rows = await sbFetch('/rest/v1/sl_messages?select=*&request_id=eq.'+id+'&order=created_at');
    S.chat = { id, rows:rows||[], err:'' };
  }catch(e){
    S.chat = { id, rows:[], err: /sl_messages|relation|schema cache|does not exist/i.test(e.message) ? 'setup' : e.message };
  }
  if(S.overlay && S.overlay.type==='chat' && S.overlay.id===id) drawChat();
}
function renderChat(c){
  const r=findReq(S.overlay.id); if(!r){ closeView(); return; }
  const o=otherSide(r);
  c.innerHTML=`
    <button class="back" onclick="closeView()">‹ Back</button>
    <div class="row" style="margin-bottom:10px">${avatarDot(initials(o.alias), S.presence && S.presence[r.id], 'background:'+courseColor(r.course))}
      <div><h2 class="title" style="margin:0">${esc(o.alias)}</h2><div class="tiny">${esc(r.course)} · ${esc(fmtDate(r.date))} ${esc(r.time||'')}</div></div></div>
    <div class="card"><div class="chat" id="chatbox"><div class="tiny" style="text-align:center;padding:10px">Loading…</div></div></div>
    <div class="composer">
      <input id="chat_in" maxlength="1000" placeholder="Message ${esc(o.alias)}…" onkeydown="if(event.key==='Enter')sendChat()">
      <button class="btn sm" onclick="sendChat()">Send</button>
    </div>
    <div class="acts"><button onclick="openView({type:'retime', id:'${r.id}'})">🕒 Suggest another time</button></div>
    <p class="tiny" style="margin:8px 2px">🔒 Keep it to scheduling and schoolwork. Don't share phone numbers, social media or where you live.</p>`;
  if(S.chat && S.chat.id===r.id) drawChat();
  loadChat(r.id);
  clearInterval(chatTimer);
  chatTimer=setInterval(()=>{ if(S.overlay && S.overlay.type==='chat' && S.overlay.id===r.id) loadChat(r.id); else clearInterval(chatTimer); }, 5000);
}
function drawChat(){
  const box=$('chatbox'); if(!box || !S.chat) return;
  if(S.chat.err==='setup'){ box.innerHTML='<div class="tiny" style="text-align:center;padding:12px">Chat isn\'t switched on yet. It needs a one-time database update from the site owner.</div>'; return; }
  if(S.chat.err){ box.innerHTML='<div class="tiny" style="text-align:center;padding:12px;color:#c23b5e">'+esc(S.chat.err)+'</div>'; return; }
  const near = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  box.innerHTML = S.chat.rows.length ? S.chat.rows.map(m=>{
    const mine=m.sender_id===A.user.id, sys=m.body.startsWith('🕒 Suggested');
    const when=new Date(m.created_at).toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});
    return sys ? `<div class="msg sys">${mine?'You':esc(otherSide(findReq(S.chat.id)).alias)}: ${esc(m.body)}<div class="t">${when}</div></div>`
      : `<div class="msg ${mine?'me':''}">${esc(m.body)}<div class="t">${when}</div></div>`;
  }).join('') : '<div class="tiny" style="text-align:center;padding:12px">No messages yet. Say hi and sort out a time.</div>';
  if(near || !box.dataset.drawn){ box.scrollTop=box.scrollHeight; box.dataset.drawn='1'; }
}
async function sendChat(){
  const inp=$('chat_in'), body=(inp.value||'').trim(); if(!body || !S.chat) return;
  if(S.chat.err==='setup'){ toast('Chat is not switched on yet.'); return; }
  inp.value='';
  S.chat.rows.push({ sender_id:A.user.id, body, created_at:new Date().toISOString() }); drawChat();
  try{ await sendMessage(S.chat.id, body); loadChat(S.chat.id); }
  catch(e){ toast(e.message); loadChat(S.chat.id); }
}

const SERIES_TOPIC = 'Ongoing sessions';
// Pending requests, with each many-sessions request folded into one group.
function requestGroups(rows){
  const groups=[], by={};
  rows.forEach(r=>{
    const key = r.topic===SERIES_TOPIC ? r.student_id+'|'+r.course+'|'+r.created_at : r.id;
    if(!by[key]) groups.push(by[key]=[]);
    by[key].push(r);
  });
  groups.forEach(g=>g.sort((a,b)=>(a.date||'').localeCompare(b.date||'')));
  return groups;
}
function seriesCard(g){
  const r=g[0], ids=g.map(x=>x.id).join(',');

    ${r.note ? `<div style="font-size:13px;margin:8px 0 0;color:#555">${esc(r.note)}</div>` : ''}

// Status changes go to the server, then everything reloads so both sides agree.
function patchRequest(id, patch, okMsg){
  return sbFetch('/rest/v1/sl_requests?id=eq.'+id, { method:'PATCH', headers:{ Prefer:'return=minimal' }, body:JSON.stringify(patch) })
    .then(loadData).then(function(){ render(); if(okMsg) toast(okMsg); })
    .catch(function(e){ toast(e.message); });
}
function cancelRequest(id){ patchRequest(id, { status:'cancelled' }, 'Request cancelled'); }
// Taking a tutoring date off the calendar. Either person in a session can
// cancel it; it asks once, right where the ✕ was, before anything changes.
const CANCEL_WORDS = { session:['Cancel session','Session cancelled'], request:['Cancel request','Request cancelled'], offer:['Withdraw offer','Offer withdrawn'] };
function cancelBtn(id, kind){
  if(S.confirmCancel===id) return `<span class="row" style="gap:6px;margin-left:auto;flex:0 0 auto" onclick="event.stopPropagation()">
      <button class="btn sm gray" onclick="S.confirmCancel=null; render()">Keep</button>
      <button class="btn sm pink" onclick="cancelTutoring('${id}','${kind}')">${CANCEL_WORDS[kind][0]}</button></span>`;
  return `<button class="del" title="${CANCEL_WORDS[kind][0]}" style="margin-left:auto;border:none;background:none;color:var(--muted);cursor:pointer;font-size:16px" onclick="event.stopPropagation(); S.confirmCancel='${id}'; render()">✕</button>`;
}
function cancelTutoring(id, kind){
  S.confirmCancel=null;
  patchRequest(id, { status:'cancelled' }, CANCEL_WORDS[kind][1]);
}
// Take a completed session off the books. The hours come off with it.
function removeDone(id){
  const r=S.incoming.find(x=>x.id===id); if(!r) return;
  if(!confirm('Remove this '+r.course+' session with '+r.student_alias+'? Its 0.75 service hours come off your total.')) return;
  sbFetch('/rest/v1/sl_requests?id=eq.'+id, { method:'DELETE', headers:{ Prefer:'return=minimal' } })
    .then(loadData).then(function(){ toast('Session removed'); render(); })
    .catch(function(e){ toast(e.message); });
}
function respondOffer(id, accept){
  const r=S.myRequests.find(x=>x.id===id); if(!r) return;
  patchRequest(id, { status: accept ? 'accepted' : 'declined' }, accept ? 'Session set with '+r.tutor_alias+' ✅' : 'Offer declined');
}
function respondRequest(id, accept){
  const r=S.incoming.find(x=>x.id===id); if(!r)return;
  patchRequest(id, { status: accept ? 'accepted' : 'declined' }, accept ? 'Session confirmed with '+r.student_alias+' ✅' : 'Request declined');
}
function completeSession(id){
  patchRequest(id, { status:'done', done_at:new Date().toISOString() }, 'Logged 0.75 service hours 🎉');
}

/* -------- FIRST-RUN SETUP -------- */
// Four short steps the first time someone signs in: grade, classes now,
// classes taken (with the grade earned), and whether they want to tutor.
// Classes taken are the only ones a person may tutor.
const LETTERS=['A+','A','A-','B+','B','B-','C+','C','C-','D+','D','D-'];
function setupState(){
  if(S.setup) return S.setup;
  const taken={}; (S.taken||[]).forEach(g=>{ taken[g.course]={ grade:g.grade||'A', year:g.year||defaultTaken() }; });
  const parsed=parseAvail(S.me.avail||'');
  S.setup = { step: hasGrade() ? 1 : 2, grade: hasGrade() ? (S.me.grade||10) : null, taking:S.myClasses.slice(), taken,
    use: S.me.isTutor ? (S.myClasses.length ? 'both' : 'tutor') : 'help',
    tutorPick: S.tutorClasses.slice(), days:parsed.days, times:parsed.times,
    format:(A.profile&&A.profile.tutor_format)||'In person', bio:(A.profile&&A.profile.tutor_bio)||'' };
  return S.setup;
}

      <button class="btn" style="flex:2" ${disabled?'disabled':''} onclick="${nextFn}">${nextLabel}</button>

  let body='';
