// Classes taken: one claim per class. Verified claims at the same grade stay;
// anything else pending is replaced; removed classes drop their pending claim.
async function syncTakenClaims(taken){
  const me=A.user.id, have=(S.taken||[]);
  const keep=new Set(have.filter(g=>g.status==='verified' && taken[g.course] && taken[g.course].grade===g.grade).map(g=>g.id));
  const drop=have.filter(g=>!keep.has(g.id) && (g.status!=='verified' || !taken[g.course])).map(g=>g.id);
  if(drop.length) await sbFetch('/rest/v1/sl_grades?id=in.('+drop.join(',')+')', { method:'DELETE', headers:{ Prefer:'return=minimal' } });
  const submit=Object.entries(taken).filter(([course])=>!have.some(g=>keep.has(g.id) && g.course===course)).map(([course,v])=>({ user_id:me, course, grade:v.grade, year:v.year }));
  if(submit.length) await sbFetch('/rest/v1/sl_grades', { method:'POST', headers:{ Prefer:'return=minimal' }, body:JSON.stringify(submit) });
}
function setupScheduleNext(){
  const bad=scheduleProblem(S.schedDraft); if(bad){ A.setupMsg=bad; return render(); }
  A.setupMsg=''; S.setup.sched=S.schedDraft.map(p=>({...p})); S.setup.step=5; render();
}
function setupToggleTaking(course){ const a=S.setup.taking, i=a.indexOf(course); if(i<0) a.push(course); else a.splice(i,1); render(); }
function setupToggleTaken(course){ const t=S.setup.taken; if(t[course]){ delete t[course]; S.setup.tutorPick=S.setup.tutorPick.filter(x=>x!==course); } else t[course]={ grade:'A', year:defaultTaken() }; render(); }
function setupTogglePick(course){ const a=S.setup.tutorPick, i=a.indexOf(course); if(i<0) a.push(course); else a.splice(i,1); render(); }
function setupPick(k,v){ const a=S.setup[k], i=a.indexOf(v); if(i<0) a.push(v); else a.splice(i,1); render(); }

async function finishSetup(btn){
  const st=S.setup, me=A.user.id;
  const wantsTutor=(st.use==='tutor'||st.use==='both') && Object.keys(st.taken).length>0;
  const picks=st.tutorPick.filter(c=>st.taken[c]);
  const avail=availText(st);
  if(wantsTutor && !picks.length){ A.setupMsg='Pick at least one class to tutor, or choose Get help.'; return render(); }
  if(wantsTutor && !avail){ A.setupMsg='Pick at least one day and one time you can help.'; return render(); }
  A.setupMsg=''; if(btn){ btn.disabled=true; btn.textContent='Saving…'; }
  try{
    await sbFetch('/rest/v1/sl_profiles?id=eq.'+me, { method:'PATCH', headers:{ Prefer:'return=minimal' }, body:JSON.stringify({ ...(hasGrade() ? { grade_level:st.grade } : { grade_level:null }), onboarded_at:new Date().toISOString(), ...(wantsTutor ? { tutor_bio:st.bio, tutor_format:st.format } : {}) }) });
    // Classes now.
    await sbFetch('/rest/v1/sl_student_classes?user_id=eq.'+me, { method:'DELETE', headers:{ Prefer:'return=minimal' } });
    if(st.taking.length) await sbFetch('/rest/v1/sl_student_classes', { method:'POST', headers:{ Prefer:'return=minimal' }, body:JSON.stringify(st.taking.map(course=>({ user_id:me, course }))) });
    await syncTakenClaims(st.taken);
    if(hasGrade() && st.sched) await saveSchedule(st.sched);
    S.schedDraft=null;
    // Tutoring.
    if(wantsTutor){
      await ensureTutorAlias();
      await sbFetch('/rest/v1/sl_tutor_courses?user_id=eq.'+me, { method:'DELETE', headers:{ Prefer:'return=minimal' } });
      await sbFetch('/rest/v1/sl_tutor_courses', { method:'POST', headers:{ Prefer:'return=minimal' }, body:JSON.stringify(picks.map(course=>({ user_id:me, course, grade:st.taken[course].grade, year:st.taken[course].year, availability:avail }))) });
    }
    // Re-read the profile so onboarded_at (and any new tutor alias) is current;
    // otherwise the stale copy sends people straight back into setup.
    A.profile.onboarded_at = new Date().toISOString();
    await loadProfile();
    await loadData();
    S.setup=null; S.setupForce=false;
    S.mode = st.use==='tutor' ? 'tutor' : 'tutee'; A.role=(S.mode==='tutor' && A.profile.tutor_alias) ? 'tutor' : 'student'; S.me.name=currentAlias();
    document.getElementById('app').classList.remove('auth');
    go('home'); toast(wantsTutor ? 'All set — you can tutor '+picks.length+' class'+(picks.length===1?'':'es') : 'All set!');
  }catch(e){
    A.setupMsg=e.message; render();
  }
}

// Letter grades and the grade a class was taken in, for the tutor steps.
const TAKEN_GRADES=['Grade 6','Grade 7','Grade 8','Grade 9','Grade 10','Grade 11','Grade 12'];
const defaultTaken = () => 'Grade ' + Math.max(6, Math.min(12, (S.me.grade||10) - 1));
// Availability is picked, not typed: days and times of day, stored as one
// readable line such as "Mon, Wed · After school, Evenings".
const AVAIL_DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const AVAIL_TIMES=['Before school','After school','Evenings'];
function togglePick(k, v){ const a=S.overlay.draft[k]; const i=a.indexOf(v); if(i<0) a.push(v); else a.splice(i,1); render(); }
function availText(d){
  const days=AVAIL_DAYS.filter(x=>d.days.includes(x)), times=AVAIL_TIMES.filter(x=>d.times.includes(x));
  if(!days.length || !times.length) return '';
  const dayStr = days.length===5 && !days.includes('Sat') && !days.includes('Sun') ? 'Weekdays' : days.length===7 ? 'Every day' : days.join(', ');
  return dayStr + ' · ' + times.join(', ');
}
function parseAvail(str){
  const days=AVAIL_DAYS.filter(x=>new RegExp('\\b'+x+'\\b').test(str)), times=AVAIL_TIMES.filter(x=>str.includes(x));
  if(/Weekdays/.test(str)) days.push('Mon','Tue','Wed','Thu','Fri');
  if(/Every day/.test(str)) days.push.apply(days, AVAIL_DAYS);
  return { days:Array.from(new Set(days)), times };
}

async function finishTutor(){
  const d=S.overlay.draft, me=A.user.id;
  const avail=availText(d);
  if(!avail){ toast('Pick at least one day and one time you can help.'); return; }
  const bio=$('bio')?$('bio').value.trim():d.bio;
  const btn=$('ft_btn'); if(btn){ btn.disabled=true; btn.textContent='Saving…'; }
  try{
    await ensureTutorAlias();
    await sbFetch('/rest/v1/sl_profiles?id=eq.'+me, { method:'PATCH', headers:{ Prefer:'return=minimal' }, body:JSON.stringify({ tutor_bio:bio, tutor_format:d.format }) });
    await sbFetch('/rest/v1/sl_tutor_courses?user_id=eq.'+me, { method:'DELETE', headers:{ Prefer:'return=minimal' } });
    const rows=Object.entries(d.courses).map(([course,v])=>({ user_id:me, course, grade:v.grade, year:v.year, availability:avail }));
    if(rows.length) await sbFetch('/rest/v1/sl_tutor_courses', { method:'POST', headers:{ Prefer:'return=minimal' }, body:JSON.stringify(rows) });
    // Each grade goes to an administrator to check. A grade already verified
    // at the same mark is left alone; anything else is submitted afresh.
    const have = await sbFetch('/rest/v1/sl_grades?select=id,course,grade,status&user_id=eq.'+me);
    const keep = new Set((have||[]).filter(g=>g.status==='verified' && d.courses[g.course] && d.courses[g.course].grade===g.grade).map(g=>g.id));
    const stale = (have||[]).filter(g=>!keep.has(g.id) && g.status==='pending').map(g=>g.id);
    if(stale.length) await sbFetch('/rest/v1/sl_grades?id=in.('+stale.join(',')+')', { method:'DELETE', headers:{ Prefer:'return=minimal' } });
    const submit = rows.filter(r => !(have||[]).some(g => keep.has(g.id) && g.course===r.course)).map(r=>({ user_id:me, course:r.course, grade:r.grade, year:r.year }));
    if(submit.length) await sbFetch('/rest/v1/sl_grades', { method:'POST', headers:{ Prefer:'return=minimal' }, body:JSON.stringify(submit) });
    await loadProfile(); await loadData();
    S.mode='tutor'; A.role='tutor'; S.me.name=currentAlias();
    closeView(); go('tutoring');
    toast('You\'re now tutoring as '+A.profile.tutor_alias+' 🎓');
  }catch(e){
    toast(e.message); if(btn){ btn.disabled=false; btn.textContent='Finish — start tutoring'; }
  }
}

// Students taking each class versus tutors for it. The gap is the story.
function needHeatHtml(){
  const rows = ALL_COURSES.map(cs=>{
    const students=(S.roster||[]).filter(r=>r.course===cs).length + (S.myClasses.includes(cs)?1:0);
    const tutors=tutorsFor(cs).length + (S.tutorClasses.includes(cs)?1:0);
    const gap = students===0 ? 'none' : tutors===0 ? 'high' : students/tutors>4 ? 'high' : students/tutors>2 ? 'some' : 'ok';
    return { cs, students, tutors, gap };
  }).filter(r=>r.students||r.tutors).sort((a,b)=>({high:0,some:1,ok:2,none:3}[a.gap]-{high:0,some:1,ok:2,none:3}[b.gap]) || (b.students-a.students));
  if(!rows.length) return '<div class="tiny" style="text-align:center;padding:8px">No classes added yet.</div>';
  const tag = g => g==='high' ? '<span class="pill" style="background:#fdecef;color:#c23b5e">High need</span>' : g==='some' ? '<span class="pill" style="background:#fbf1e2;color:#c98b34">Thin</span>' : g==='ok' ? '<span class="pill" style="background:#e4f6ec;color:#2e9b6a">Covered</span>' : '<span class="pill">No students</span>';
  return `<div class="listrow" style="cursor:default;font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.5px"><span class="t">Class</span><span class="r" style="width:70px;text-align:right">Students</span><span class="r" style="width:60px;text-align:right">Tutors</span><span class="r" style="width:90px;text-align:right">Gap</span></div>` +
    rows.map(r=>`<div class="listrow" onclick="openClass('${esc(r.cs)}')"><span class="dot" style="background:${courseColor(r.cs)}"></span><span class="t">${esc(r.cs)}</span><span class="r" style="width:70px;text-align:right">${r.students}</span><span class="r" style="width:60px;text-align:right">${r.tutors}</span><span class="r" style="width:90px;text-align:right">${tag(r.gap)}</span></div>`).join('');
}

function addMember(){
  const name=($('mb_name').value||'').trim(), email=($('mb_email').value||'').trim().toLowerCase(), grade=$('mb_grade').value, role=$('mb_role').value;
  if(!name){ $('mb_name').focus(); return; }

  const btn=$('mb_add'); if(btn){ btn.disabled=true; btn.textContent='Adding…'; }
  sbFetch('/rest/v1/sl_staff', { method:'POST', headers:{ Prefer:'return=representation,resolution=merge-duplicates' }, body:JSON.stringify({ email, real_name:name, grade_level: grade ? Number(grade) : null, role, added_by:A.user.id, added_by_alias:A.profile.student_alias, join_code:makeCode() }) })
    .then(function(rows){ const r = rows && rows[0]; S.addMemberOpen=false; toast(r && r.join_code ? name + ' added · code ' + r.join_code : name + ' added'); render(); })

// Codes are made here and stored on the approval row; the join function
// checks them. Unambiguous letters and digits, four and four.
function makeCode(){
  const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789', b=new Uint8Array(8); crypto.getRandomValues(b);
  const c=Array.from(b, x=>a[x%a.length]).join(''); return c.slice(0,4)+'-'+c.slice(4);
}
function copyCode(code, btn){
  if(!code) return;
  const done=function(){ toast('Code '+code+' copied'); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done, done); else done();
}
function newCode(email){
  const code=makeCode();
  sbFetch('/rest/v1/sl_staff?email=eq.'+encodeURIComponent(email), { method:'PATCH', headers:{ Prefer:'return=minimal' }, body:JSON.stringify({ join_code:code, code_created_at:new Date().toISOString(), code_used_at:null }) })
    .then(function(){ toast('New code for '+email+': '+code); render(); }).catch(function(e){ toast(e.message); });
}
// Level, name and grade are edited on the approval row; a trigger carries the
// change through to the person's profile if they have signed up.
function setMemberLevel(email, role, sel){
  const label = { student:'a student', admin:'an administrator', board:'on the board' }[role];
  sbFetch('/rest/v1/sl_staff?email=eq.'+encodeURIComponent(email), { method:'PATCH', headers:{ Prefer:'return=minimal' }, body:JSON.stringify({ role }) })
    .then(function(){ toast(email+' is now '+label); render(); })
    .catch(function(e){ toast(e.message); render(); });
}
function saveMember(email){
  const k = email.replace(/\W/g,'_');
  const real_name = (($('me_name_'+k)||{}).value||'').trim(), g = ($('me_grade_'+k)||{}).value||'';
  if(!real_name){ $('me_name').focus(); return; }
  sbFetch('/rest/v1/sl_staff?email=eq.'+encodeURIComponent(email), { method:'PATCH', headers:{ Prefer:'return=minimal' }, body:JSON.stringify({ real_name, grade_level: g ? Number(g) : null }) })
    .then(function(){ toast('Saved'); render(); })
    .catch(function(e){ toast(e.message); });
}
function removeMember(email){
  if(!confirm('Remove '+email+' from SilverCircle? Their account and everything in it will be deleted.')) return;
  sbFetch('/rest/v1/sl_staff?email=eq.'+encodeURIComponent(email), { method:'DELETE', headers:{ Prefer:'return=minimal' } })
    .then(function(){ toast('Removed '+email); render(); }).catch(function(e){ toast(e.message); });
}

// After the alias screen: straight in if a session is already saved.
function finishIssued(){
  A.authView = 'signin'; A.authMsg = ''; A.authOk = '';
  if(A.token){ loadProfile().then(render).catch(function(){ render(); }); } else render();
}
async function doSetPassword(){
  const a = ($('np_pass')||{}).value || '', b = ($('np_pass2')||{}).value || '';
  if(a.length < 6){ A.authMsg = 'Passwords must be at least 6 characters.'; return render(); }
  if(a !== b){ A.authMsg = 'Those two do not match.'; return render(); }
  A.authBusy = true; A.authMsg = ''; render();
  try {
    await sbFetch('/auth/v1/user', { method:'PUT', body: JSON.stringify({ password: a }) });
    A.authBusy = false;
    const alias = await ensureProfile();      // first arrival: issue the alias
    if(alias){ A.signedUpAlias = alias; A.authView = 'issued'; A.profile = null; }
    else { A.authView = 'signin'; }
    render();
  } catch(e){
    A.authBusy = false;
    A.authMsg = /approved/i.test(e.message) ? 'This email address has not been approved by the school.' : e.message;
    render();
  }
}
// An invite or reset email lands here with tokens in the URL fragment.
async function consumeAuthLink(){
  const h = location.hash || '';
  if(h.indexOf('access_token=') < 0) return false;
  const q = new URLSearchParams(h.replace(/^#/, ''));
  const token = q.get('access_token'), type = q.get('type') || '';
  A.refresh = q.get('refresh_token') || null;
  history.replaceState(null, '', location.pathname + location.search);
  if(!token) return false;
  try {
    A.token = token;
    const user = await sbFetch('/auth/v1/user');
    A.user = user; saveSession(); dataLoaded = false;
    A.linkType = type; A.profile = null;
    if(type === 'recovery' || type === 'invite'){ A.authView = 'setpw'; return true; }
    // Email confirmed after sign-up: the password is already set, so issue the alias.
    const alias = await ensureProfile();
    if(alias){ A.signedUpAlias = alias; A.authView = 'issued'; A.profile = null; }
    return true;
  } catch(e){ clearSession(); A.authMsg = 'That link has expired. Ask for a new one.'; return false; }
}

// Switch between the sign-in views, clearing any message from the last one.
function authGo(view){ A.authView = view; A.authMsg = ''; A.authOk = ''; A.draft = null; render(); }

// Enter submits; the first empty field gets focus.
function wireAuthForm(submit, firstId){
  const card = document.querySelector('.auth-card'); if(!card) return;
  card.querySelectorAll('input').forEach(function(el){
    el.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); window[submit](); } });
  });
  const empty = Array.from(card.querySelectorAll('input')).find(function(el){ return !el.value; }) || document.getElementById(firstId);
  if(empty) setTimeout(function(){ empty.focus(); }, 0);
}

function togglePw(id, btn){
  const el = document.getElementById(id); if(!el) return;
  const show = el.type === 'password';
  el.type = show ? 'text' : 'password'; btn.textContent = show ? 'Hide' : 'Show';
  el.focus();
}

// What was typed survives a re-render (an error, or the busy state).
function keepDraft(ids){
  A.draft = {};
  ids.forEach(function(id){ const el = document.getElementById(id); if(el) A.draft[id] = el.value; });
}

async function doSignIn(){
  const u = (document.getElementById('si_user')||{}).value || '';
  const p = (document.getElementById('si_pass')||{}).value || '';
  keepDraft(['si_user']);
  if(!u.trim() || !p){ A.authMsg = 'Please enter your alias and password.'; return render(); }
  A.authBusy = true; A.authMsg = ''; A.authOk = ''; render();
  try {
    const newAlias = await signIn(u, p);
    A.authBusy = false; A.draft = null;
    // Only set on the very first sign-in, when the profile was just created.
    if(newAlias){ A.signedUpAlias = newAlias; A.authView = 'issued'; A.profile = null; }
    render();
  }
  catch(e){
    A.authBusy = false;
    A.authMsg = /Invalid/i.test(e.message) ? 'That alias and password do not match.' : e.message;
    render();
  }
}

async function doSignUp(){
  const g = function(id){ return ((document.getElementById(id)||{}).value || '').trim(); };
  const email = g('su_email').toLowerCase(), code = g('su_code'), pass = g('su_pass');
  keepDraft(['su_email','su_code']);
  if(!email || !code || !pass){ A.authMsg = 'Email, join code and a password are all needed.'; return render(); }
  if(pass.length < 6){ A.authMsg = 'Passwords must be at least 6 characters.'; return render(); }
  A.authBusy = true; A.authMsg = ''; A.authOk = ''; render();
  try {
    // The join function checks the code and creates the account; then we sign
    // straight in with the password just chosen, and the alias is issued.
    await sbFetch('/functions/v1/sl-join', { method:'POST', body: JSON.stringify({ email, code, password: pass }) });
    const alias = await signIn(email, pass);
    A.authBusy = false; A.draft = null;
    if(alias){ A.signedUpAlias = alias; A.authView = 'issued'; A.profile = null; }
    else { A.authView = 'signin'; }
    render();
  }
  catch(e){
    A.authBusy = false;
    A.authMsg = /rate limit/i.test(e.message) ? 'Too many attempts right now. Try again in a little while.' : e.message;
    render();
  }
}

async function doReset(){
  const email = ((document.getElementById('rs_email')||{}).value || '').trim();
  keepDraft(['rs_email']);
  if(!email){ A.authMsg = 'Please enter your email address.'; return render(); }
  try { await sendReset(email); A.authMsg = ''; A.authView = 'signin'; A.draft = null; A.authOk = 'If an account exists for that address, a reset link has been sent.'; render(); }
  catch(e){ A.authMsg = e.message; render(); }
}

    const msg = (body && (body.message || body.error_description || body.msg || (typeof body.error === 'string' ? body.error : null))) || r.statusText;
    if(!retried && A.token && (r.status === 401 || /jwt expired|invalid jwt|token is expired/i.test(msg))){
      try { await refreshSession(); return sbFetch(path, opts, true); }
      catch(e){ signOut(); toast('Your session expired. Please sign in again.'); throw e; }
    }
    throw new Error(msg);
  }
  return body;
}

// Aliases — what other students see instead of a name. Two words, picked from a
// big pool so the same one rarely comes up twice, and you choose from five.
const ALIAS_ADJ = ['Amber','Brisk','Clever','Dusty','Eager','Fleet','Golden','Hidden','Iron','Jolly',
  'Keen','Lucky','Mellow','Noble','Opal','Plucky','Quiet','Rapid','Silver','Tidy','Upbeat','Violet','Witty','Zesty'];
const ALIAS_NOUN = ['Otter','Falcon','Maple','Comet','Lantern','Harbor','Cactus','Pixel','Meadow','Anchor',
  'Beacon','Cedar','Domino','Ember','Fossil','Glider','Heron','Inkwell','Juniper','Kestrel','Lynx','Marble'];
function randomAlias(){
  const a = ALIAS_ADJ[Math.floor(Math.random()*ALIAS_ADJ.length)];
  const n = ALIAS_NOUN[Math.floor(Math.random()*ALIAS_NOUN.length)];
  return a + ' ' + n + ' ' + (10 + Math.floor(Math.random()*89));
}
function aliasChoices(){ const out=[]; while(out.length<5){ const a=randomAlias(); if(!out.includes(a)) out.push(a); } return out; }

function saveSession(){ try{ localStorage.setItem(AUTH_LS, JSON.stringify({ token:A.token, refresh:A.refresh, user:A.user })); }catch(e){} }
// Access tokens last an hour. The refresh token swaps them for new ones; any
// request that comes back with an expired token is retried once after that.
function tokenExp(){ try { return JSON.parse(atob(A.token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).exp * 1000; } catch(e){ return 0; } }
let refreshing = null;
async function refreshSession(){
  if(!A.refresh) throw new Error('Session expired. Please sign in again.');
  if(refreshing) return refreshing;
  refreshing = (async () => {
    const r = await fetch(SB + '/auth/v1/token?grant_type=refresh_token', { method:'POST', headers:{ apikey:SKEY, 'Content-Type':'application/json' }, body: JSON.stringify({ refresh_token: A.refresh }) });
    const d = await r.json().catch(() => null);
    if(!r.ok || !d || !d.access_token) throw new Error('Session expired. Please sign in again.');
    A.token = d.access_token; A.refresh = d.refresh_token || A.refresh; if(d.user) A.user = d.user; saveSession();
    return true;
  })();
  try { return await refreshing; } finally { refreshing = null; }
}
async function ensureFreshToken(){
  if(!A.token || !A.refresh) return;
  if(tokenExp() - Date.now() < 5*60*1000) { try { await refreshSession(); } catch(e) {} }
}
function clearSession(){ try{ localStorage.removeItem(AUTH_LS); }catch(e){} A.token=null; A.refresh=null; A.user=null; A.profile=null; }

async function loadProfile(){
  const rows = await sbFetch('/rest/v1/sl_profiles?select=*&id=eq.' + A.user.id);
  A.profile = rows && rows[0] ? rows[0] : null;
  // The app knows you by whichever alias fits what you're currently doing.
  if(A.profile){
    S.me.name  = currentAlias();
    S.me.grade = A.profile.grade_level || S.me.grade;
  }
}

async function signIn(idOrEmail, password){
  // You sign in with your alias. The email behind it is resolved server-side by
  // sl_login_email, which checks the password before returning anything — so
  // aliases, which are public by design, can't be used to harvest addresses.
  let email = idOrEmail.trim();
  if(!email.includes('@')){
    const found = await sbFetch('/rest/v1/rpc/sl_login_email', {
      method:'POST', headers:{ Authorization:'Bearer ' + SKEY },
      body: JSON.stringify({ p_alias: email, p_password: password })
    });
    if(!found) throw new Error('Invalid login credentials');
    email = found;
  }
  const d = await sbFetch('/auth/v1/token?grant_type=password', {
    method:'POST', headers:{ Authorization:'Bearer ' + SKEY },
    body: JSON.stringify({ email, password })
  });
  A.token = d.access_token; A.refresh = d.refresh_token; A.user = d.user; saveSession(); dataLoaded = false;
  return await ensureProfile();   // issues the alias if this is their first sign-in
}

async function signUp({ email, password, realName, gradeLevel }){
  // Create the account first. The alias used to be claimed before this, which
  // burned a Student number every time a signup failed and showed an error
  // where the alias should have been.
  const d = await sbFetch('/auth/v1/signup', {
    method:'POST', headers:{ Authorization:'Bearer ' + SKEY },
    body: JSON.stringify({
      email: email.trim(), password,
      data: { real_name: realName.trim(), grade_level: Number(gradeLevel) || null }
    })
  });
  A.token = d.access_token || (d.session && d.session.access_token);
  A.refresh = d.refresh_token || (d.session && d.session.refresh_token);
  A.user  = d.user || (d.session && d.session.user);
  // No session means email confirmation is on. The account exists, but nothing
  // can be written as them until they confirm and sign in, so the alias is
  // issued then instead.
  if(!A.token) return null;
  saveSession();
  return await ensureProfile();
}

// Give this account a profile and a student number if it doesn't have one yet.
// Runs on first sign-in as well as after signup, so it works whether or not
// email confirmation is switched on.
async function ensureProfile(){
  await loadProfile();
  if(A.profile) return null;
  const alias = await sbFetch('/rest/v1/rpc/sl_next_alias', {
    method:'POST', body: JSON.stringify({ kind:'student' })
  });
  const meta = (A.user && A.user.user_metadata) || {};
  await sbFetch('/rest/v1/sl_profiles', {
    method:'POST', headers:{ Prefer:'return=minimal' },
    body: JSON.stringify({
      id: A.user.id,
      real_name: meta.real_name || 'Unknown',
      grade_level: meta.grade_level || null,
      student_alias: alias
    })
  });
  await loadProfile();
  return alias;   // non-null only the first time, so the alias screen shows once
}

// Claim a tutor alias the first time someone offers to tutor, so their two
// identities are separate numbers that can't be matched to each other.
async function ensureTutorAlias(){
  if(A.profile && A.profile.tutor_alias) return A.profile.tutor_alias;
  const alias = await sbFetch('/rest/v1/rpc/sl_next_alias', {
    method:'POST', body: JSON.stringify({ kind:'tutor' })
  });
  await sbFetch('/rest/v1/sl_profiles?id=eq.' + A.user.id, {
    method:'PATCH', headers:{ Prefer:'return=minimal' },
    body: JSON.stringify({ tutor_alias: alias })
  });
  await loadProfile();
  return alias;
}

async function sendReset(email){
  await sbFetch('/auth/v1/recover?redirect_to=' + encodeURIComponent(APP_URL), {
    method:'POST', headers:{ Authorization:'Bearer ' + SKEY },
    body: JSON.stringify({ email: email.trim() })
  });
}

async function restoreSession(){
  try{
    const raw = localStorage.getItem(AUTH_LS); if(!raw) return false;
    const s = JSON.parse(raw); if(!s || !s.token) return false;
    A.token = s.token; A.refresh = s.refresh || null; A.user = s.user; dataLoaded = false;
    if(tokenExp() < Date.now()){ await refreshSession(); }   // came back after an hour or more
    await loadProfile();
    return !!A.profile;
  }catch(e){ clearSession(); return false; }
}
function signOut(){
  clearSession(); dataLoaded=false; A.role='student';
  Object.assign(S, { myRequests:[], incoming:[], posts:[], tutors:[], myClasses:[], tutorClasses:[], events:[], hours:0, helped:0, tab:'home', overlay:null });
  S.me = { name:'You', grade:11, isTutor:false, tutorCourses:[], avail:'' };
  A.authView='signin'; render();
}

/* ============================= DATA (server) ============================= */
// Everything the signed-in person can see, loaded after sign-in and again
// after any change. A school's worth of rows is small; no paging needed.
let dataLoaded = false, dataLoading = false, dataError = null;
async function loadData(){
  if(!A.user) return;
  const me = A.user.id;
  if(dataLoaded) { try { await loadProfile(); } catch(e) {} }   // background refreshes pick up profile changes too
  const [classes, tcourses, reqs, events, tutors, posts, myGrades, pendingGrades, materials, roster, presence, people, allReqs, avail] = await Promise.all([
    sbFetch('/rest/v1/sl_student_classes?select=course&user_id=eq.'+me+'&order=created_at'),
    sbFetch('/rest/v1/sl_tutor_courses?select=course,grade,year,availability&user_id=eq.'+me+'&order=created_at'),
    sbFetch('/rest/v1/sl_requests?select=*&or=(student_id.eq.'+me+',tutor_id.eq.'+me+')&order=created_at.desc'),
    sbFetch('/rest/v1/sl_events?select=*&user_id=eq.'+me+'&order=date'),
    sbFetch('/rest/v1/sl_tutors?select=*'),
    sbFetch('/rest/v1/sl_posts?select=*&order=created_at.desc&limit=500'),
    sbFetch('/rest/v1/sl_grades?select=id,course,grade,year,status&user_id=eq.'+me),
    isStaff() ? sbFetch('/rest/v1/sl_grades?select=id&status=eq.pending') : Promise.resolve([]),
    sbFetch('/rest/v1/sl_materials?select=*&order=created_at.desc&limit=500'),
    sbFetch('/rest/v1/sl_class_students?select=*'),
    sbFetch('/rest/v1/sl_request_presence?select=*'),
    sbFetch('/rest/v1/sl_people?select=*'),
    isAdmin() ? sbFetch('/rest/v1/sl_requests?select=*&order=created_at.desc&limit=500') : Promise.resolve([]),
    sbFetch('/rest/v1/sl_availability?select=*&order=recurring.desc,weekday,date,start_min'),
  ]);
  S.myClasses = (classes||[]).map(r=>r.course);
  S.tutorClasses = (tcourses||[]).map(r=>r.course);
  S.me.tutorCourses = (tcourses||[]).map(r=>{ const g=(myGrades||[]).find(x=>x.course===r.course); return { course:r.course, grade:r.grade||'', year:r.year||'', verify: g ? g.status : 'none' }; });
  S.taken = myGrades||[];   // classes I've taken, from setup; the only ones I may tutor
  S.pendingGrades = (pendingGrades||[]).length;
  S.me.avail = ((tcourses||[]).find(r=>r.availability)||{}).availability || '';
  S.me.isTutor = !!(A.profile && A.profile.tutor_alias) && S.tutorClasses.length > 0;
  S.myRequests = (reqs||[]).filter(r=>r.student_id===me);
  S.incoming = (reqs||[]).filter(r=>r.tutor_id===me);
  S.events = events||[];
  S.posts = posts||[];
  S.materials = materials||[];
  S.roster = (roster||[]).filter(r => r.user_id !== me && !(people||[]).some(p => p.user_id===r.user_id && p.role==='admin'));
  S.presence = {}; (presence||[]).forEach(function(x){ S.presence[x.request_id] = x.other_seen_at; });
  S.people = (people||[]).filter(x => x.user_id !== me);
  S.allRequests = allReqs||[];
  S.availability = avail||[];
  S.tutors = buildTutors(tutors||[], me);
  S.helped = S.incoming.filter(r=>r.status==='done').length;
  S.hours = Math.round(S.helped*0.75*100)/100;
  if(S.mode==='tutor' && !(A.profile && A.profile.tutor_alias)) S.mode='tutee';
  A.role = (S.mode==='tutor' && A.profile && A.profile.tutor_alias) ? 'tutor' : 'student';
  S.me.name = currentAlias();
  dataLoaded = true;
  heartbeat();
}
// One row per class per tutor comes back; fold them into one tutor each.
function buildTutors(rows, me){
  const by = {};
  rows.forEach(function(r){
    if(r.user_id===me) return;
    const t = by[r.user_id] || (by[r.user_id] = { id:r.user_id, name:r.tutor_alias, grade:r.grade_level, bio:r.tutor_bio||'', format:r.tutor_format||'In person', seen:r.last_seen_at,
      avail:'', sessions:Number(r.sessions_done)||0, courses:[], color:TUTOR_COLORS[hashStr(r.user_id)%TUTOR_COLORS.length] });
    t.courses.push({ course:r.course, grade:r.grade||'', year:r.year||'', verified:!!r.verified });
    if(r.availability && !t.avail) t.avail = r.availability;
  });
  return Object.values(by);
}
// Online status. The app pings while it is open; anyone seen in the last two
// minutes shows as online. Only the alias and the dot are ever shown.
function isOnline(ts){ return !!ts && (Date.now() - new Date(ts).getTime()) < 2*60*1000; }
function seenLabel(ts){
  if(!ts) return '';
  const m = Math.round((Date.now() - new Date(ts).getTime())/60000);
  if(m < 2) return 'Online now';
  if(m < 60) return 'Active '+m+'m ago';
  const h = Math.round(m/60); if(h < 24) return 'Active '+h+'h ago';
  const d = Math.round(h/24); return d===1 ? 'Active yesterday' : 'Active '+d+' days ago';
}
const seenHtml = ts => ts ? `<span class="seen ${isOnline(ts)?'on':''}">${isOnline(ts)?'● ':''}${seenLabel(ts)}</span>` : '';
// An avatar with the little status dot.
const avatarDot = (inner, ts, style) => `<span class="avwrap"><div class="avatar" style="${style||''}">${inner}</div><span class="odot ${isOnline(ts)?'on':''}" title="${seenLabel(ts)||'Not seen yet'}"></span></span>`;
let lastBeat = 0;
function heartbeat(){
  if(!A.user || !A.profile || Date.now() - lastBeat < 45000) return;
  lastBeat = Date.now();
  sbFetch('/rest/v1/sl_profiles?id=eq.'+A.user.id, { method:'PATCH', headers:{ Prefer:'return=minimal' }, body:JSON.stringify({ last_seen_at:new Date().toISOString() }) }).catch(function(){});
}
setInterval(function(){ if(!document.hidden) heartbeat(); }, 60000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) heartbeat(); });

// Pick up what other people did while this tab was in the background.
document.addEventListener('visibilitychange', function(){ if(!document.hidden && A.profile && dataLoaded) loadData().then(function(){ if(!S.overlay) render(); }).catch(function(){}); });
setInterval(function(){ if(!document.hidden && A.profile && dataLoaded) loadData().then(function(){ if(!S.overlay) render(); }).catch(function(){}); }, 60000);

/* ============================= INIT ============================= */
load();
consumeAuthLink().then(function(fromLink){ return fromLink ? null : restoreSession(); }).then(function(){ render(); });
</script>
